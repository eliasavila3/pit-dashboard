<style>
/* Layout: pit control board in Madtown 1323 blue. Sticky header (coyote mark, pit clock, next-match chip); side rail on tablets, bottom tab bar on phones; large touch rows. */
:root{
  --bg:#F1F3FA; --surface:#FFFFFF; --surface-2:#E7EBF7; --line:#CDD3E8;
  --ink:#0A0F2E; --ink-2:#394266; --ink-3:#646E92;
  --brand:#0024FF; --brand-ink:#0024FF; --on-brand:#FFFFFF; --brand-soft:#E3E8FF; --brand-deep:#00125E;
  --ok:#147A43; --ok-soft:#DCF2E5; --warn:#B25400; --warn-soft:#FCEAD8; --bad:#C0221A; --bad-soft:#FCE2DF;
  --red:#D3262F; --blue:#0B78C8;
  --scrim:rgba(6,10,30,.55);
  --on-hdr:#0024FF;
  --f-brand:"Michroma","Saira Semi Condensed",system-ui,sans-serif;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rail:96px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060919; --surface:#0E1330; --surface-2:#171E45; --line:#273062;
  --ink:#EEF1FF; --ink-2:#B6BDE2; --ink-3:#8A93BF;
  --brand:#2F4FFF; --brand-ink:#93A6FF; --on-brand:#FFFFFF; --brand-soft:#141E5C; --brand-deep:#030820;
  --ok:#45C47D; --ok-soft:#10301F; --warn:#F39A4B; --warn-soft:#38230F; --bad:#FF6B5E; --bad-soft:#3C1714;
  --red:#FF5C63; --blue:#4DB0FF;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
  --on-hdr:#FFFFFF;
}}
:root[data-theme="dark"]{
  --bg:#060919; --surface:#0E1330; --surface-2:#171E45; --line:#273062;
  --ink:#EEF1FF; --ink-2:#B6BDE2; --ink-3:#8A93BF;
  --brand:#2F4FFF; --brand-ink:#93A6FF; --on-brand:#FFFFFF; --brand-soft:#141E5C; --brand-deep:#030820;
  --ok:#45C47D; --ok-soft:#10301F; --warn:#F39A4B; --warn-soft:#38230F; --bad:#FF6B5E; --bad-soft:#3C1714;
  --red:#FF5C63; --blue:#4DB0FF;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
  --on-hdr:#FFFFFF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

/* ---------- Shell ---------- */
.shell{min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}

.b2{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.sync.live i{background:var(--ok)} .sync.local i{background:var(--warn)}
.iconbtn{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{background:var(--surface-2)}
.hchip{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);text-align:left}
.hchip .l{font-family:var(--f-display);font-weight:700;font-size:22px}
.hchip .s{font-size:14px;color:var(--ink-2);line-height:1.15}
.hchip .s b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hchip.queue{background:repeating-linear-gradient(-45deg,var(--brand) 0 12px,var(--brand-deep) 12px 24px);border-color:var(--brand-deep)}
.hchip.queue .l,.hchip.queue .s{background:var(--surface);color:var(--ink);padding:0 6px;border-radius:4px}
.hchip.red{box-shadow:inset 6px 0 0 var(--red)} .hchip.blue{box-shadow:inset 6px 0 0 var(--blue)}

.nav{position:fixed;z-index:30;background:var(--surface);border-top:1px solid var(--line);inset:auto 0 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(7,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;border:0;background:none;color:var(--ink-3);font-size:12.5px;font-weight:600;padding:6px 2px}
.nav button[aria-current="page"]{color:var(--brand-ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:18%;right:18%;height:4px;border-radius:0 0 4px 4px;background:var(--brand)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-size:12px;line-height:20px;font-weight:700;background:var(--ink-2);color:var(--surface)}
.nav .badge.bad{background:var(--bad);color:#fff}
.nav .badge.warn{background:var(--warn);color:#fff}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;max-width:1240px;margin:0 auto}
@media (min-width:900px){
  .nav{inset:0 auto 0 0;width:calc(var(--rail) + env(safe-area-inset-left,0px));grid-template-columns:1fr;grid-auto-rows:84px;align-content:start;
    border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 76px);padding-left:env(safe-area-inset-left,0px);padding-right:0}
  .nav button{font-size:13.5px;min-height:84px}
  .nav button[aria-current="page"]{background:var(--brand-soft)}
  .nav button[aria-current="page"]::before{top:16%;bottom:16%;left:0;right:auto;width:5px;height:auto;border-radius:0 4px 4px 0}
  .nav .badge{top:12px}
  .shell{margin-left:calc(var(--rail) + env(safe-area-inset-left,0px))}
  .top{padding-left:24px}
  main{padding-left:24px;padding-block:24px 48px}
}
@media (max-width:620px){
  .top{gap:8px}
  .clock{font-size:18px}
  .b2{display:none}
  .hchip{order:5;flex:1 1 100%}
}

/* ---------- Common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;text-align:center;line-height:1.15}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand);filter:brightness(1.12)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.red{background:var(--red);color:#fff} .pill.blue{background:var(--blue);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.seg.alli button[data-v="red"].on{background:var(--red);border-color:var(--red);color:#fff}
.seg.alli button[data-v="blue"].on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg.sev button[data-v="critical"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.sev button[data-v="major"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.seg.status button[data-v="fixed"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:16px}
.tabs button{min-height:46px;padding:0 18px;border-radius:9px;border:0;background:none;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:5px}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.sbar > i{display:block;height:100%}
.sbar .d{background:var(--ok)} .sbar .m{background:var(--bad)} .sbar .u{background:var(--warn)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.empty h3{font-size:24px;color:var(--ink)}
.empty p{max-width:52ch}
.field{display:grid;gap:6px}
.field > span{font-weight:600;font-size:15px;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:14px}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;min-height:52px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:17px}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form{display:grid;gap:16px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.notice{padding:12px 14px;border-radius:10px;background:var(--brand-soft);color:var(--ink);font-size:15px}
.notice.bad{background:var(--bad-soft)} .notice.warn{background:var(--warn-soft)}

/* ---------- Next match ---------- */
.nm{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;display:grid;gap:12px;box-shadow:inset 8px 0 0 var(--ink-3)}
.nm.red{box-shadow:inset 8px 0 0 var(--red)} .nm.blue{box-shadow:inset 8px 0 0 var(--blue)}
.nm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:6px}
.nm-main{display:flex;align-items:flex-end;gap:18px 28px;flex-wrap:wrap;padding-left:6px}
.nm-label{font-family:var(--f-display);font-weight:700;font-size:84px;line-height:.85}
.nm-times{display:flex;gap:22px;flex-wrap:wrap}
.tcol{display:grid;gap:2px}
.tcol .k{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tcol .cd{font-family:var(--f-mono);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.tcol .at{font-size:14px;color:var(--ink-2)}
.nm-teams{display:flex;gap:6px 18px;flex-wrap:wrap;padding-left:6px;font-size:16px;color:var(--ink-2)}
.nm-teams b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.nm-actions{display:flex;gap:10px;flex-wrap:wrap;padding-left:6px}
.caution{margin:-16px -18px 0;height:46px;display:grid;place-items:center;background:repeating-linear-gradient(-45deg,var(--brand) 0 18px,var(--brand-deep) 18px 36px)}
.caution span{background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase;padding:2px 14px;border-radius:4px}
.onfield{margin:-16px -18px 0;padding:10px 18px;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .caution{background-size:51px 51px;animation:march 1.2s linear infinite}
  @keyframes march{to{background-position:51px 0}}
}
@media (max-width:520px){ .nm-label{font-size:64px} .tcol .cd{font-size:32px} }

/* ---------- Home ---------- */
.home{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.home > *{grid-column:span 12;min-width:0}
@media (min-width:760px){ .home .t-half{grid-column:span 6} }
.tile{display:grid;gap:12px;align-content:start;text-align:left;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%}
button.tile:hover{border-color:var(--brand)}
.tile-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile-head .go{font-size:15px;font-weight:600;color:var(--brand-ink)}
.big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.9}
.big small{font-size:22px;color:var(--ink-3);font-weight:600;margin-left:6px}
.tlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tlist li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;min-width:0}
.tlist .nm1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .r{flex:none;font-size:14px;color:var(--ink-3)}

/* ---------- Checklist status ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select{width:auto;min-width:200px;flex:1 1 220px;font-weight:600}
.hero{display:grid;gap:14px;padding:18px;margin-bottom:16px}
.hero-top{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.verdict{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:26px}
.verdict.ok{background:var(--ok);color:#fff} .verdict.no{background:var(--surface-2);color:var(--ink)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.count{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.count .v{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.count .k{font-size:14px;font-weight:600;color:var(--ink-2)}
.count.d .v{color:var(--ok)} .count.m .v{color:var(--bad)} .count.u .v{color:var(--warn)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.sumgrid > *{min-width:0}
.panel{padding:16px 18px;display:grid;gap:12px;align-content:start}
.panel h3{font-size:22px;display:flex;align-items:center;gap:8px}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.arow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.arow.missing{box-shadow:inset 5px 0 0 var(--bad)} .arow.unclear{box-shadow:inset 5px 0 0 var(--warn)} .arow.pending{box-shadow:inset 5px 0 0 var(--line)}
.arow .t{min-width:0;padding-left:4px}
.arow .t .no{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink-3);margin-right:6px}
.arow .t .sec{display:block;font-size:13.5px;color:var(--ink-3)}
.arow .acts{display:flex;gap:6px}
.arow .acts .btn{min-height:44px;padding:0 12px;font-size:14.5px}
.txt b{font-weight:700}
.star{color:var(--brand-ink);display:inline-flex;vertical-align:-3px}
.tick{width:100%;display:grid;grid-template-columns:40px 1fr;align-items:center;column-gap:14px;min-height:62px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:18px}
.tick .box{width:40px;height:40px;border-radius:8px;border:2.5px solid var(--ink-3);display:grid;place-items:center;background:var(--surface)}
.tick .box svg{width:28px;height:28px;stroke-width:3}
.tick .by{grid-column:2;font-size:13.5px;color:var(--ink-3)}
.tick.done{background:var(--ok-soft);border-color:transparent}
.tick.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.delruns .tick{min-height:60px;font-size:17px}
/* quick scan (full-screen camera) */
.qs{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--brand-deep);color:var(--ink)}
.qs-top,.qs-bottom{background:var(--surface);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qs-top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.qs-bottom{display:grid;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.qs-for{display:grid;line-height:1.1;flex:1;min-width:0}
.qs-for b{font-family:var(--f-display);font-size:28px}
.qs-sel{width:auto;min-height:48px;max-width:46vw;font-weight:600}
.qs-stage{position:relative;overflow:hidden;min-height:0}
.qs-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.qs-frame{position:absolute;inset:8% 6%;border:3px dashed var(--on-brand);border-radius:14px;opacity:.75;pointer-events:none}
.qs-flash{position:absolute;inset:0;background:var(--on-brand);opacity:0;pointer-events:none}
.qs-flash.go{animation:qsflash .45s ease-out}
@keyframes qsflash{0%{opacity:.85}100%{opacity:0}}
.qs-msg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 20px;border-radius:14px;background:var(--brand-deep);color:var(--on-brand);font-weight:700;font-size:20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.qs.fb .qs-msg{top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));font-size:19px;font-weight:600}
.qs.fb .qs-frame{display:none}
.qs-prog{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qs-count{font-family:var(--f-mono);font-weight:600;font-size:16px}
.qs-chips{display:flex;gap:5px;flex-wrap:wrap}
.qs-chips i{font-style:normal;min-width:30px;height:30px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink-3)}
.qs-chips i.cap{background:var(--brand-soft);color:var(--brand-ink);box-shadow:inset 0 0 0 2px var(--brand)}
.qs-chips i.ok{background:var(--ok);color:#fff}
.qs-acts{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.qs-acts .btn{min-height:56px}
.qs-shutter{width:78px;height:78px;border-radius:50%;border:6px solid var(--surface-2);background:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.qs-shutter:active{transform:scale(.94)}
#qs-fb{grid-template-columns:1fr auto}
.qs-fbbtn{min-height:64px;font-size:19px}
.qs-end{position:absolute;inset:0;z-index:2;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.qs-card{width:min(560px,100%);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.qs-card h2{font-size:28px}
.aslist .no{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--brand-ink);margin-right:8px}
.aslist .r.asn{color:var(--ink);font-weight:700;font-size:16px}
.asw{font-weight:600;color:var(--ink-3)}

.delruns .tick.done{background:var(--bad-soft)}
.delruns .tick.done .box{background:var(--bad);border-color:var(--bad)}
.secs{display:grid;gap:8px}
.secs details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.secreset{display:flex;justify-content:flex-end;padding:0 14px 12px}
.arow .scanpeek{grid-column:1/-1}
.scanpeek{display:grid;gap:4px;width:100%;margin-top:2px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;text-align:left;cursor:zoom-in}
.scanpeek .sp-img{display:block;height:110px;background-repeat:no-repeat;background-size:200% auto;background-color:var(--surface-2)}
.scanpeek .sp-cap{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand-ink);padding:2px 10px 8px}
.scanpeek .sp-cap svg{width:16px;height:16px}
.peeklink{min-height:36px;padding:0 10px;font-size:14px;margin-left:6px;vertical-align:middle}
.peeklink svg{width:16px;height:16px}
.peekwrap{position:relative;min-height:min-content;border:1px solid var(--line);border-radius:10px;overflow:clip;background:var(--surface-2)}   /* min-height keeps the box as tall as the photo, so the band's % lines up */
.peekwrap img{display:block;width:100%;height:auto}
.peekmark{position:absolute;left:0;right:0;height:2.6%;min-height:14px;transform:translateY(-50%);border:2px solid var(--brand);border-radius:4px;background:color-mix(in srgb,var(--brand) 14%,transparent);pointer-events:none}
.resetnote{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.secs summary{list-style:none;display:grid;grid-template-columns:minmax(120px,1fr) minmax(90px,2fr) auto;gap:12px;align-items:center;min-height:56px;padding:8px 14px;cursor:pointer}
.secs summary::-webkit-details-marker{display:none}
.secs summary .nm1{font-weight:700}
.secs summary .nm1 .no{font-family:var(--f-mono);color:var(--ink-3);margin-right:6px}
.secs summary .n{font-family:var(--f-mono);font-size:14px;color:var(--ink-2);text-align:right;white-space:nowrap}
.ilist{list-style:none;margin:0;padding:4px 14px 12px;display:grid;gap:4px}
.irow{display:grid;grid-template-columns:28px 52px 1fr auto;gap:8px;align-items:center;min-height:44px;font-size:16px;border-top:1px solid var(--surface-2);padding-top:4px}
.irow.sub{padding-left:22px}
.irow .no{font-family:var(--f-mono);font-size:13.5px;color:var(--ink-3)}
.irow .st{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:2px solid var(--line)}
.irow .st svg{width:18px;height:18px;stroke-width:3}
.irow.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.irow.missing .st{border-color:var(--bad);color:var(--bad)} .irow.unclear .st{border-color:var(--warn);color:var(--warn)}
.irow .btn{min-height:38px;padding:0 10px;font-size:14px}
.ihead{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:8px}

/* ---------- Builder ---------- */
.yearh{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.yearh h2{font-family:var(--f-brand);font-size:20px;font-weight:400;letter-spacing:.04em;color:var(--brand-ink)}

/* ---------- Lists ---------- */

.mrow.red{box-shadow:inset 6px 0 0 var(--red)} .mrow.blue{box-shadow:inset 6px 0 0 var(--blue)}

.delay{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.rcard{display:flex;gap:8px;align-items:stretch}

.rcard.critical .rmain{box-shadow:inset 6px 0 0 var(--bad)}

.rtop{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:4px}
.rtitle{font-size:19px;font-weight:700;padding-left:4px}
.rmeta{font-size:14px;color:var(--ink-3);padding-left:4px}
.rquick{flex:none;width:96px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:6px}
.rquick.fix{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.stat .k{font-size:14px;color:var(--ink-3);font-weight:600}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
.subbars{display:grid;gap:8px}
.subbar{display:grid;grid-template-columns:minmax(100px,140px) 1fr 70px;gap:12px;align-items:center;font-size:15px}
.subbar .track{height:16px;display:flex;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.subbar .o{background:var(--bad)} .subbar .f{background:var(--ok)}
.subbar .n{font-family:var(--f-mono);font-size:14px;text-align:right;color:var(--ink-2)}
.part{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 12px 10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.part.low{border-color:var(--warn);box-shadow:inset 6px 0 0 var(--warn)}
.part-main{min-width:0;display:grid;gap:4px;text-align:left;border:0;background:none;padding:4px 0}
.part-main .nm1{font-weight:700;font-size:18px}
.part-main .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-3)}
.loc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:15px}

.qty{display:flex;align-items:center;gap:6px}

.qty .n{min-width:52px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:22px}
.qty .n small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--f-body);font-weight:600}
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.loccard{display:grid;gap:6px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.loccard .ln{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.loccard .ld{font-size:15px;color:var(--ink-2)}
.loccard .ldesc{font-size:15px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.ipop-d{font-size:15px;font-weight:600;color:var(--ink);margin-top:2px}
.bindesc{font-size:17px;font-weight:600;margin:0}
.loccard .lc{font-size:14px;color:var(--ink-3)}
/* ---------- Inventory map (Inventory area) ---------- */

.invtitle .tabs{margin:0}
#inv-lowbtn{flex:0 0 auto}
#inv-lowbtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.warnt{color:var(--warn)}
.part-loc{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.pno{font-family:var(--f-mono);font-weight:600;color:var(--ink-2)}
.ordn{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--warn);color:#fff;font-size:14px;line-height:24px;font-weight:700}
.ordlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ord.off{opacity:.55}
.ordchk{display:grid;place-items:center;width:44px;height:44px;cursor:pointer}

.plink{text-decoration:none;color:var(--brand-ink)}
.mvrow{grid-template-columns:auto minmax(0,1fr);cursor:pointer}
.ptnums{align-items:start}
.pt4{grid-template-columns:repeat(2,minmax(0,1fr))}
.mvbar{justify-content:space-between;margin-bottom:10px}
.plink svg.i{width:18px;height:18px}
button.loc{min-height:44px;height:auto;padding:6px 12px;border:1px solid transparent;text-align:left;cursor:pointer;max-width:100%}
button.loc:hover{border-color:var(--brand)}
.loc small{font-weight:600;font-size:13px;opacity:.85}
.invres{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.invres-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-weight:700;font-size:17px}
.invres-h .spacer{flex:1}
.invres-list{display:flex;gap:8px;flex-wrap:wrap}
.ires{display:inline-flex;align-items:center;gap:8px;min-height:48px;max-width:100%;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:left;font-size:15px}
.ires:hover{border-color:var(--brand)}
.ires b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ires .q{font-family:var(--f-mono);color:var(--ink-2)}
.ires .w{display:inline-flex;align-items:center;gap:4px;color:var(--brand-ink);font-weight:700;white-space:nowrap}
.ires .w.none{color:var(--ink-3)}
.ires .w{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* Inventory map only: let the page use the full screen width (owner-approved exception to the shared 1240px cap) */
main:has(.invmaps){max-width:none}
.invmaps{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:639px){ .invmaps{grid-template-columns:minmax(0,1fr)} }
.invunit{padding:8px 10px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;min-width:0}
.invunit-h{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.invunit-h > div:first-child{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-width:0}
.invunit-h h2{font-size:24px}
.invunit-h .s{font-size:14px;color:var(--ink-3)}
.invadd{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:2px dashed var(--line);border-radius:14px;background:transparent;color:var(--ink-2);font-weight:700;font-size:18px}
.invadd:hover{border-color:var(--brand);color:var(--brand-ink)}
.invoff{display:grid;gap:10px;margin-top:16px;padding:12px 14px}
.istage-wrap{position:relative;min-width:0}
.istage-scroll{min-width:0}
.istage{--maxh:72vh;position:relative;width:min(100%,calc(var(--maxh) * var(--ar,1)));aspect-ratio:var(--ar,1);margin:0 auto;border-radius:10px;overflow:hidden;background:var(--surface-2);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* map tab: fit the photos to the screen height (set in fitInvMaps); phones use full width and scroll */
.invmaps .istage{width:min(100%,calc(var(--fit,72vh) * var(--ar,1)));container-type:inline-size}
@media (max-width:639px){ .invmaps .istage{width:100%} }
.invmaps .ibox .ib-l{font-size:clamp(12px,3.4cqi,16px);line-height:1.45;padding:0 .35em}
.ibox .ib-d{font-weight:500;font-size:.85em;color:var(--ink-2)}
/* with a description: name and description share a line when the box is wide, and wrap inside the box when it's narrow */
.ibox .ib-l.has-d{white-space:normal;overflow-wrap:anywhere;max-height:calc(100% - 4px);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;line-height:1.3;padding-block:1px}
.ibox .ib-l.has-d .ib-nm{white-space:nowrap}
.invmaps .ibox .ib-n{font-size:clamp(11px,3cqi,15px);height:auto;line-height:1.6;min-width:1.7em;padding:0 .45em}
.istage img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:fill;pointer-events:none;-webkit-user-drag:none;transition:filter .2s}
.istage.searching img{filter:brightness(.5) saturate(.6)}
.istage .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-weight:600}
/* full screen: one storage unit covers the whole window (under sheets and toasts); --fit is set in fitInvMaps */
.invunit.full{position:fixed;inset:0;z-index:55;border:0;border-radius:0;align-content:start;overflow:auto;overscroll-behavior:contain;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.invunit.full .istage{width:min(100%,calc(var(--fit,80vh) * var(--ar,1)))}
.iboxes{position:absolute;inset:0}
.ibox{position:absolute;display:block;padding:0;margin:0;min-width:0;min-height:0;border:2px solid var(--brand);border-radius:4px;background:color-mix(in srgb,var(--brand) 14%,transparent);box-shadow:0 0 0 1px var(--surface);cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit}
.ibox:hover,.ibox.pop{border-width:3px;background:color-mix(in srgb,var(--brand) 28%,transparent)}
.ibox:focus-visible{outline:3px solid var(--surface);outline-offset:0;border-width:3px}
.ibox.empty{border-style:dashed}
.ibox.low{border-color:var(--warn)}
.ibox .ib-l{position:absolute;left:2px;top:2px;max-width:calc(100% - 4px);padding:0 5px;border-radius:3px;background:var(--surface);color:var(--ink);font:700 16px/24px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 35%,transparent)}
@media (max-width:639px){ .ibox .ib-l{font-size:13px;line-height:19px;padding:0 4px} }
.ibox .ib-n{position:absolute;right:2px;bottom:2px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--brand);color:var(--on-brand);font:700 15px/26px var(--f-mono);text-align:center}
.ibox .ib-w{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.ibox.dim{opacity:.4;border-color:var(--surface);background:transparent;box-shadow:none}
.ibox.dim .ib-l{opacity:.85}
.ibox.hit{z-index:2;border-width:3px;border-color:var(--brand);background:color-mix(in srgb,var(--brand) 42%,transparent);box-shadow:0 0 0 2px var(--surface),0 0 0 6px color-mix(in srgb,var(--brand) 45%,transparent)}
.ibox.focus{z-index:3;border-width:3px;box-shadow:0 0 0 2px var(--surface),0 0 0 7px var(--brand)}
@media (prefers-reduced-motion:no-preference){
  .ibox.hit,.ibox.focus{animation:ipulse 1.6s ease-in-out infinite}
  @keyframes ipulse{50%{box-shadow:0 0 0 2px var(--surface),0 0 0 11px color-mix(in srgb,var(--brand) 18%,transparent)}}
}
.inote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:10px;justify-items:center;padding:14px 18px;border-radius:12px;background:var(--surface);text-align:center;font-weight:600;max-width:90%}
.ipop{position:absolute;z-index:5;width:290px;max-width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 28%,transparent);display:grid;gap:8px;pointer-events:none}

.ipop-c{font-size:15px;color:var(--ink-2);font-weight:600}

/* keep long part names and descriptions inside the popup: the one column may shrink, names end in "…" */
.ipop,.ipop ul{grid-template-columns:minmax(0,1fr)}

.ipop-t,.ipop-d{overflow-wrap:anywhere}

.loc-h{font-size:28px;margin:20px 0 4px}

/* ---------- helpers ---------- */
const $ = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const newCode = () => Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
const now = () => Date.now();
const clone = o => o==null?o:JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function deepMerge(t,s){ for(const k in s){ const v=s[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k])) deepMerge(t[k],v); else t[k]=clone(v); } return t; }
const pad2 = n => String(n).padStart(2,"0");
const fmtClock = ms => new Date(ms).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const fmtDay = ms => new Date(ms).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
function ago(ms){ if(!ms) return ""; const d=(now()-ms)/1000; if(d<45) return "just now"; if(d<3600) return Math.round(d/60)+"m ago"; if(d<6*3600) return Math.floor(d/3600)+"h "+pad2(Math.round(d%3600/60))+"m ago"; return fmtDay(ms)+" "+fmtClock(ms); }
function dur(ms){ const m=Math.round(ms/60000); if(m<60) return m+" min"; return Math.floor(m/60)+"h "+pad2(m%60)+"m"; }
function cdText(ms){ if(ms<=0) return "Now"; const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return h? h+"h "+pad2(m)+"m" : m+":"+pad2(ss); }
const isCaps = w => { const c=w.replace(/[^A-Za-z’']/g,"").replace(/[’']/g,""); return c.length>=2 && /^[A-Z]+$/.test(c) && !ACRONYMS.has(c); };
function fmtItem(t){ return esc(t).replace(/\b([A-Z][A-Z’']+)\b/g,(w)=> isCaps(w)? "<b>"+w+"</b>" : w); }
function toLocalInput(ms){ const d=new Date(ms); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function todayInput(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function seasonYear(){ const d=new Date(); return d.getMonth()>=8 ? d.getFullYear()+1 : d.getFullYear(); }

};

/* =========================================================
   Data store: Supabase tables + realtime when signed in, this device otherwise
   Each collection is a table of {id, data jsonb}; data holds the record exactly as before.
   ========================================================= */
const COLS = ["meta","checklists","prints","runs","scans","matches","inventory","locations","repairs","notes","pitmap","batteries","battlog"];
const S = {}; COLS.forEach(c=>S[c]={});

const Q = {};
const sb = (window.supabase && /^https:\/\//.test(SUPABASE_URL) && !SUPABASE_URL.includes("YOUR-PROJECT")) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const Store = {
  mode:"connecting", db:null, ready:null, loaded:{}, buf:{}, ts:{},
  start(){
    this.ready = (async ()=>{
      let session=null;
      try{ if(sb){ const r=await sb.auth.getSession(); session=r.data&&r.data.session; } }catch(e){ console.warn("auth",e); }
      if(session){
        me.id=session.user.id; me.email=session.user.email||"";
        /* links this sign-in to its pit_members row and returns editor / viewer, or null when the email isn't on the board */
        let role;
        for(let i=0;;i++){ const r=await sb.rpc("pit_claim"); if(!r.error){ role=r.data||null; break; } console.warn("pit_claim",r.error); await sleep(Math.min(15000,1500*(i+1))); }
        me.access=role?"member":"none";
        if(role){ this.db=sb; this.mode="live"; me.readOnly= role!=="editor"; }
        else this.mode="local";
      } else this.mode="local";
      if(this.mode==="live") this.subscribe(); else COLS.forEach(c=>this.listen(c));
      paintSync();
    })();
  },
  subscribe(){
    const ch=sb.channel("pit-board");
    COLS.forEach(col=>ch.on("postgres_changes",{event:"*",schema:"public",table:col},p=>this.change(col,p)));
    /* (re)load every table each time the channel (re)joins, so nothing missed while offline is lost */
    ch.subscribe(status=>{ if(status==="SUBSCRIBED") COLS.forEach(c=>this.load(c)); else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT") COLS.forEach(c=>{ this.loaded[c]=false; }); });
  },
  async load(col){
    this.loaded[col]=false; this.buf[col]=[];
    const m={}, ts={};
    try{
      for(let from=0;;from+=1000){
        const {data,error}=await sb.from(col).select("id,data,updated_at").order("id").range(from,from+999);
        if(error) throw mapErr(error);
        data.forEach(r=>{ m[r.id]=Object.assign(clone(r.data||{}),{id:r.id}); ts[r.id]=r.updated_at; });
        if(data.length<1000) break;
      }
    }catch(e){ handleErr(e); setTimeout(()=>this.load(col),3000); return; }
    S[col]=m; this.ts[col]=ts; this.loaded[col]=true;
    const b=this.buf[col]; this.buf[col]=[]; b.forEach(p=>this.apply(col,p));
    reapply(col); onData(col);
  },
  change(col,p){ if(!this.loaded[col]){ (this.buf[col]||(this.buf[col]=[])).push(p); return; } this.apply(col,p); reapply(col); onData(col); },
  apply(col,p){
    const ts=this.ts[col]||(this.ts[col]={});
    if(p.eventType==="DELETE"){ const id=p.old&&p.old.id; if(id){ delete S[col][id]; delete ts[id]; } return; }
    const r=p.new; if(!r||!r.id) return;
    if(ts[r.id] && r.updated_at && new Date(r.updated_at)<new Date(ts[r.id])) return;   /* older than what we already have */
    S[col][r.id]=Object.assign(clone(r.data||{}),{id:r.id}); ts[r.id]=r.updated_at;
  },
  listen(col){ S[col]=localRead(col); reapply(col); onData(col); },
  async raw(col,id,op){
    if(this.mode==="live"){
      const run=async()=>{
        const r = op.kind==="set" ? await sb.from(col).upsert({id, data:op.payload})
          : op.kind==="update" ? await sb.rpc("pit_merge",{col, doc_id:id, patch:op.payload})
          : await sb.from(col).delete().eq("id",id);
        if(r.error) throw mapErr(r.error);
      };
      try{ await run(); }
      catch(e){ if(e&&e.code==="unavailable"){ await sleep(400+Math.random()*700); await run(); } else throw e; }
    } else {
      const m=localRead(col);
      if(op.kind==="set") m[id]=clone(op.payload);
      else if(op.kind==="update"){ if(m[id]) deepMerge(m[id],op.payload); }
      else delete m[id];
      localWrite(col,m);
    }
  }
};
/* Supabase / PostgREST errors in the codes handleErr() already knows */
function mapErr(e){
  const c=String(e&&e.code||""), st=Number(e&&(e.status||e.statusCode))||0, msg=String(e&&e.message||"");
  const code = (c==="42501"||st===403) ? "invalid_argument"
    : (c==="PGRST301"||c==="PGRST302"||st===401||/jwt/i.test(msg)) ? "revoked"
    : (c==="53100"||c==="54000") ? "quota_exceeded"
    : st===429 ? "resource_exhausted"
    : (/fetch|network|timeout|load failed/i.test(msg)||st>=500) ? "unavailable" : c||"unknown";
  return {code, message:msg, cause:e};
}
function localRead(col){ try{ const m=JSON.parse(localStorage.getItem("pitdb:"+col)||"{}"); for(const k in m) m[k].id=k; return m; }catch(e){ return {}; } }
function localWrite(col,m){ try{ const o={}; for(const k in m){ const v=Object.assign({},m[k]); delete v.id; o[k]=v; } localStorage.setItem("pitdb:"+col, JSON.stringify(o)); }catch(e){} }
window.addEventListener("storage", e=>{ if(Store.mode==="local" && e.key && e.key.startsWith("pitdb:")){ const col=e.key.slice(6); if(S[col]){ S[col]=localRead(col); reapply(col); onData(col); } } });

function applyOp(map,id,kind,payload){
  if(kind==="set") map[id]=Object.assign(clone(payload),{id});
  else if(kind==="update"){ if(map[id]){ const c=clone(map[id]); deepMerge(c,payload); map[id]=c; } }
  else delete map[id];
}
function reapply(col){ for(const k in Q){ const q=Q[k]; if(q.col!==col) continue; q.ops.forEach(op=>applyOp(S[col],q.id,op.kind,op.payload)); } }
function write(col,id,kind,payload){
  if(me.readOnly){ toast("This board is view-only for you. Ask the owner to share it with you as an Editor.","bad"); return false; }
  applyOp(S[col],id,kind,payload);
  const key=col+"/"+id;
  const q=Q[key]||(Q[key]={col,id,ops:[],running:false});
  const last=q.ops[q.ops.length-1];
  if(kind==="update" && last && !last.started && (last.kind==="update"||last.kind==="set")) deepMerge(last.payload, payload);
  else if(kind==="delete"){ q.ops=q.ops.filter(o=>o.started); q.ops.push({kind,payload:null}); }
  else q.ops.push({kind,payload:clone(payload)});
  drain(q); onData(col);
  return true;
}
async function drain(q){
  if(q.running) return; q.running=true;
  try{ await Store.ready; }catch(e){}
  while(q.ops.length){
    const op=q.ops[0]; op.started=true;
    try{ await Store.raw(q.col,q.id,op); }catch(e){ handleErr(e,true); }
    q.ops.shift();
  }
  q.running=false;
}
function handleErr(e,isWrite){
  const code=e&&e.code;
  if(code==="invalid_argument" && isWrite){ me.readOnly=true; toast("Couldn't save. This board may be view-only for you.","bad"); }
  else if(code==="quota_exceeded") toast("The board's storage is full. Delete old scans, notes or matches to make room.","bad");
  else if(code==="resource_exhausted") toast("Saving too fast. Wait a few seconds and try again.","bad");
  else if(code==="revoked") toast("Access to this board changed. Reload the page.","bad");
  else if(isWrite) toast("Couldn't save that change. Check the connection and try again.","bad");
  console.warn("store",e);
}

const clSorted = () => Object.values(S.checklists).sort((a,b)=>(b.year||0)-(a.year||0)||(b.updatedAt||0)-(a.updatedAt||0));
function defaultChecklist(){ const s=settings(); return (s.defaultChecklistId && S.checklists[s.defaultChecklistId]) || clSorted()[0] || null; }
const isCheck = it => it && it.type!=="heading" && String(it.text||"").trim();
const printed = it => it.mode!=="app";
/* Numbers only the printed checks: section 3, item 4 → "3.4"; sub-checks → "3.4a". */
function numberCl(cl){
  const out={secs:[], map:{}, byId:{}, printedCount:0, appCount:0};
  let sn=0;
  (cl.sections||[]).forEach(sec=>{
    const items=sec.items||[];
    const hasPrinted=items.some(it=>isCheck(it)&&printed(it));
    const sNo=hasPrinted? ++sn : null;
    let n=0, sub=0, lastMain=null;
    const rows=items.map(it=>{
      let no=null;
      if(isCheck(it)){
        if(!printed(it)){ out.appCount++; if(it.type!=="sub"){ lastMain=null; } }
        else {
          out.printedCount++;
          if(it.type==="sub" && lastMain){ sub++; no=lastMain+String.fromCharCode(96+Math.min(sub,26)); }
          else { n++; sub=0; lastMain=sNo+"."+n; no=lastMain; }
          out.map[no]=it.id;
        }
      }
      const r={it,no,sec,sNo}; out.byId[it.id]=r; return r;
    });
    out.secs.push({sec,sNo,rows});
  });
  return out;
}
function runState(run){
  const cl=run && S.checklists[run.checklistId]; if(!cl) return null;
  const N=numberCl(cl), checks=run.checks||{}, paper=run.paper||{};
  const cnt=()=>({done:0,missing:0,unclear:0,pending:0,total:0});
  const all=cnt(), items=[], secs=[];
  N.secs.forEach(s=>{
    const c=cnt(), its=[];
    s.rows.forEach(r=>{
      if(!isCheck(r.it)){ its.push(Object.assign({head:true},r)); return; }
      const id=r.it.id, chk=checks[id];
      const st= chk?"done" : paper[id]==="blank"?"missing" : paper[id]==="unclear"?"unclear" : "pending";
      const x=Object.assign({},r,{id,st,c:chk}); its.push(x); items.push(x); c[st]++; c.total++; all[st]++; all.total++;
    });
    secs.push(Object.assign({},s,{its,c}));
  });
  return {cl,N,items,secs,c:all,pct:all.total?Math.round(all.done/all.total*100):0, verified: all.total>0 && all.done===all.total};
}
function subsystems(){ const cl=defaultChecklist(); const names=cl?(cl.sections||[]).map(s=>s.name).filter(Boolean):[]; return [...new Set([...names,"Drivetrain","Electronics","Bumpers","Battery","Software","Other"])]; }

const runsSorted = () => Object.values(S.runs).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function activeRun(){ const s=settings(); return (s.activeRunId && S.runs[s.activeRunId]) || runsSorted()[0] || null; }
const mlabel = m => (MTYPE[m.type]||"Q")+(m.num||"?");
const matchesSorted = () => Object.values(S.matches).sort((a,b)=>(a.time||9e15)-(b.time||9e15) || (a.num||0)-(b.num||0));
const effTime = m => (m.time||0)+(Number(settings().delay)||0)*60000;
function nextMatch(){ const t=now(); return matchesSorted().find(m=>m.time && !m.result && effTime(m)>t-6*60000) || null; }
function phaseOf(m){ const t=now(), at=effTime(m), q=at-(Number(settings().queueLead)||0)*60000; return t<q?"pre":t<at?"queue":"field"; }
const runForMatch = m => runsSorted().find(r=>r.matchId===m.id) || null;
const openRepairs = () => Object.values(S.repairs).filter(r=>r.status!=="fixed");
const sevRank = {critical:0,major:1,minor:2};
const lowParts = () => Object.values(S.inventory).filter(p=>Number(p.min)>0 && Number(p.qty)<=Number(p.min));

  const open=openRepairs(), crit=open.some(r=>r.severity==="critical"), low=lowParts().length;

async function go(v,force){
  if(!VIEWS[v]) v="home";
  if(!force && ui.ed && ui.ed.dirty){ if(!(await confirmBox("You have unsaved checklist changes. Leave without saving them?","Discard changes"))) return; }
  if(v!=="checklist" || force!=="keep-ed") ui.ed=null;
  ui.view=v; PREF.set("view",v);
  try{ history.replaceState(null,"","#"+v); }catch(e){}
  $("#view").innerHTML = VIEWS[v].shell();
  if(VIEWS[v].mount) VIEWS[v].mount();
  render(); window.scrollTo(0,0);
}

function tick(){
  const t=now();
  $("#h-clock").textContent = new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $$("[data-t]").forEach(el=>{ el.textContent = cdText(Number(el.dataset.t)-t); });
  const m=nextMatch(), chip=$("#h-next");
  if(m){
    const ph=phaseOf(m), at=effTime(m), q=at-(Number(settings().queueLead)||0)*60000;
    chip.hidden=false;
    chip.className="hchip "+(m.alliance||"")+(ph==="queue"?" queue":"");
    const line = ph==="pre" ? `Queue in <b>${cdText(q-t)}</b>` : ph==="queue" ? `QUEUE NOW · on field <b>${cdText(at-t)}</b>` : "On the field";
    chip.innerHTML = `<span class="l">${esc(mlabel(m))}</span><span class="s">${line}</span>`;
    const key=m.id+":"+ph; if(ui.lastPhase && ui.lastPhase!==key){ ui.lastPhase=key; scheduleRender(); } ui.lastPhase=key;
  } else { chip.hidden=true; if(ui.lastPhase){ ui.lastPhase=""; scheduleRender(); } }
}

/* Where each row sits on its printed page (points), from the same layout the PDF uses. The page code is printed at x 506, y 12, 70 pt square. */
const CL_QR_BOX={x:506,y:12,s:70}, rowLayoutCache={};
async function rowLayout(cl){
  const key=cl.id+":"+(cl.version||1)+":"+(cl.updatedAt||0); if(rowLayoutCache[key]) return rowLayoutCache[key];
  await loadPdfLib(); const m=buildPdf(cl,numberCl(cl),"",{},{}); rowLayoutCache[key]=m; return m;
}
function pageToPhoto(hit,x,y){   /* page points -> fraction of the photo (y down), plus photo-height per point */
  const u=(x-CL_QR_BOX.x)/CL_QR_BOX.s, v=(y-CL_QR_BOX.y)/CL_QR_BOX.s;
  if(hit.tl && hit.tr && hit.bl) return {y:hit.tl.y+u*(hit.tr.y-hit.tl.y)+v*(hit.bl.y-hit.tl.y), unit:Math.abs(hit.bl.y-hit.tl.y)/CL_QR_BOX.s};
  if(hit.s>0) return {y:(hit.cy-hit.s/2)+v*hit.s, unit:hit.s/CL_QR_BOX.s};
  return null;
}
/* Fine-tune: the thin printed line under each row shows up in the photo. Starting from the page code's position and size,
   match the expected row lines to the lines found in the photo (nearest the code first) and fit page points -> photo pixels.
   This corrects for the page being slightly tilted or curved. Returns y(pt) in photo pixels, or null. */
function rowFit(c,hit,L,page,px0,px1){
  const rows=Object.values(L).filter(r=>r.p===page).sort((a,b)=>a.top-b.top); if(rows.length<2) return null;
  const H=c.height, Wd=c.width, S=hit.s*H/CL_QR_BOX.s;                       /* photo pixels per point near the code */
  const y0=(hit.tl?hit.tl.y:hit.cy-hit.s/2)*H, xC=hit.cx*Wd;                   /* top of the code, centre of the code */
  const X=pt=>Math.round(xC+(pt-(CL_QR_BOX.x+CL_QR_BOX.s/2))*S);
  const xa=Math.max(0,X(px0==null?300:px0)), xb=Math.min(Wd-1,X(px1==null?540:px1)); if(xb-xa<20) return null;
  const g=c.getContext("2d",{willReadFrequently:true}).getImageData(xa,0,xb-xa,H).data, w=xb-xa, prof=new Float32Array(H), col=[];
  for(let y=0;y<H;y++){ col.length=0; for(let x=0;x<w;x+=2){ const i=(y*w+x)*4; col.push(.299*g[i]+.587*g[i+1]+.114*g[i+2]); } col.sort((a,b)=>a-b); prof[y]=col[col.length>>1]; }   /* median: lines darken every column, text only some */
  const R=Math.max(8,Math.round(13*S)), dips=[];
  for(let y=R;y<H-R;y++){ let sum=0; for(let k=-R;k<=R;k++) sum+=prof[y+k]; const d=sum/(2*R+1)-prof[y];
    if(d>=3){ let best=true; for(let k=-4;k<=4;k++) if(prof[y+k]<prof[y]) { best=false; break; } if(best) dips.push(y); } }
  if(dips.length<3) return null;
  const lines=rows.map(r=>r.top+r.h-1);
  let a=y0-CL_QR_BOX.y*S, b=S, q=0;                                           /* y = a + b*pt + q*pt^2 */
  const f=pt=>a+b*pt+q*pt*pt, pairs=[];
  const refit=()=>{
    const n=pairs.length;
    if(n===1){ a=pairs[0][1]-b*pairs[0][0]-q*pairs[0][0]*pairs[0][0]; return; }  /* one line: shift only */
    if(n<6){ let sx=0,sy=0,sxx=0,sxy=0; pairs.forEach(([x,y])=>{ sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }); const den=n*sxx-sx*sx; if(den){ b=(n*sxy-sx*sy)/den; a=(sy-b*sx)/n; q=0; } return; }
    let s0=n,s1=0,s2=0,s3=0,s4=0,t0=0,t1=0,t2=0; pairs.forEach(([x,y])=>{ const x2=x*x; s1+=x; s2+=x2; s3+=x2*x; s4+=x2*x2; t0+=y; t1+=x*y; t2+=x2*y; });
    const M=[[s0,s1,s2,t0],[s1,s2,s3,t1],[s2,s3,s4,t2]];
    for(let i=0;i<3;i++){ let piv=i; for(let r=i+1;r<3;r++) if(Math.abs(M[r][i])>Math.abs(M[piv][i])) piv=r; [M[i],M[piv]]=[M[piv],M[i]]; if(!M[i][i]) return; for(let r=0;r<3;r++) if(r!==i){ const k=M[r][i]/M[i][i]; for(let cc=i;cc<4;cc++) M[r][cc]-=k*M[i][cc]; } }
    a=M[0][3]/M[0][0]; b=M[1][3]/M[1][1]; q=M[2][3]/M[2][2];
  };
  /* walk down the page one row line at a time, re-fitting after each match, so the fit follows the real row spacing */
  for(const pt of lines){
    const e=f(pt), slope=b+2*q*pt, tol=0.35*26*slope; let best=null;
    dips.forEach(y=>{ if(Math.abs(y-e)<tol && (best==null||Math.abs(y-e)<Math.abs(best-e))) best=y; });
    if(best==null) continue;
    pairs.push([pt,best]); refit();
  }
  if(pairs.length<3) return null;
  const s1=b+2*q*lines[0], s2=b+2*q*lines[lines.length-1];
  if(!(s1>0.75*S && s1<1.25*S && s2>0.75*S && s2<1.25*S)) return null;      /* stay close to what the code says */
  f.xm=(xa+xb)/2;   /* the strip these lines were measured in (photo x) */
  return f;

    foot:`<button class="btn" data-close>Close</button><button class="btn" data-s="flag">Problem</button><button class="btn primary" data-s="ok">${ICON.check}Mark done</button>`,

          c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);

            mk.style.height=(pg.hit.s*26/70*100).toFixed(2)+"%";
            if(cl && pg.code===String(cl.code).toUpperCase() && pg.ver===(cl.version||1)){
              let L=null; try{ L=await rowLayout(cl); }catch(e){}
              const r=L&&L[id];
              if(r && r.p===pg.page){
                const fit=(a,b)=>{ try{ return rowFit(c,pg.hit,L,pg.page,a,b); }catch(e){ return null; } };
                const fR=fit(300,540);
                if(fR){ const mid=r.top+r.h/2, t=fR(r.top), btm=fR(r.top+r.h); let yc=fR(mid), sl=null;
                  /* page tilt: the same row line measured in two narrow strips on the right (little text there); used only when they agree */
                  const fA=fit(330,440), fB=fit(440,550);

                    if(pa>0 && Math.abs(pa-pb)/pa<0.05){ const v=(fB(mid)-fA(mid))/(fB.xm-fA.xm); if(Math.abs(v)<0.045) sl=v; } }
                  if(sl==null && pg.hit.tl && pg.hit.tr){ const v=(pg.hit.tr.y-pg.hit.tl.y)*c.height/((pg.hit.tr.x-pg.hit.tl.x)*c.width); if(Math.abs(v)<0.045) sl=v; }   /* or the code's own top edge */
                  if(sl!=null) yc=yc+sl*(c.width/2-fR.xm);
                  if(t>0 && btm<c.height){ mk.style.top=(yc/c.height*100).toFixed(2)+"%"; mk.style.height=((btm-t)/c.height*100).toFixed(2)+"%";
                    if(sl) mk.style.transform=`translateY(-50%) rotate(${(Math.atan(sl)*180/Math.PI).toFixed(2)}deg)`; placed=true; } }
                if(!placed){ const m=pageToPhoto(pg.hit,r.x,r.top+r.h/2);
                  if(m && m.y>0 && m.y<1){ mk.style.top=(m.y*100).toFixed(2)+"%"; mk.style.height=(r.h*m.unit*100).toFixed(2)+"%"; placed=true; } } } } } }catch(e){}
        if(placed || p.y!=null){ mk.hidden=false; mk.scrollIntoView({block:"center"}); }
        if(note) note.innerHTML=placed?`The blue band marks ${what}. Decide from the photo, or check the robot.`:p.y!=null?`The blue band marks roughly where the reader found ${what}. Decide from the photo, or check the robot.`:`Look for ${what} on the page. Decide from the photo, or check the robot.`;
      },{once:true});
      el.addEventListener("click",e=>{ const b=e.target.closest("[data-s]"); if(!b) return; closeSheet();

        else { const rid=run.flags&&run.flags[id]; if(rid && S.repairs[rid]) repairSheet(rid); else repairSheet(null,{title:String(x.it.text).replace(/\s+/g," "), subsystem:x.sec.name, found:run.label, runId:run.id, itemId:id}); } }); } });
}

/* Reset: clear checks and paper results for the whole match checklist, or one section, so it can be done again.
   Logged problems (flags) and repairs stay. The last reset can be undone for two minutes. */
async function resetRun(secId){
  const run=activeRun(), rs=run&&runState(run); if(!rs) return;
  const C=run.checks||{}, P=run.paper||{}, sec=secId&&rs.secs.find(x=>x.sec.id===secId);
  const ids=rs.items.filter(x=>(!secId||x.sec.id===secId) && (C[x.id]||P[x.id])).map(x=>x.id);
  if(!ids.length){ toast("Nothing has been checked yet."); return; }
  const what=sec?`“${sec.sec.name}” on ${run.label}`:run.label;
  if(!(await confirmBox(sec?`Clear the ${ids.length} marked item${ids.length===1?"":"s"} in ${what}? They go back to “Not checked yet” so the section can be checked again.`
      :`Clear every check on ${run.label} (${ids.length} item${ids.length===1?"":"s"})? Everything goes back to “Not checked yet” so the checklist can be done again. Logged problems and repairs are kept.`, sec?"Reset section":"Reset checklist"))) return;
  const cpatch={}, ppatch={}, prevC={}, prevP={};
  ids.forEach(id=>{ prevC[id]=C[id]||null; prevP[id]=P[id]||null; cpatch[id]=null; ppatch[id]=null; });
  const patch={checks:cpatch,paper:ppatch}; if(!sec) patch.resetAt=now();
  if(!write("runs",run.id,"update",patch)) return;
  ui.lastReset={runId:run.id, at:now(), n:ids.length, what:sec?sec.sec.name:run.label, checks:prevC, paper:prevP, whole:!sec, prevResetAt:run.resetAt||null};
  toast(sec?`${sec.sec.name} reset`:`${run.label} reset. Ready to check again.`); render();
}
function undoReset(){
  const u=ui.lastReset; if(!u || !S.runs[u.runId]) return;
  const patch={checks:u.checks,paper:u.paper}; if(u.whole) patch.resetAt=u.prevResetAt;
  write("runs",u.runId,"update",patch); ui.lastReset=null; toast("Reset undone"); render();
}

function parseItemLine(line){
  let t=line.trim(), type="check", priority=false, mode="paper";
  if(/^##\s*/.test(t)){ type="heading"; t=t.replace(/^##\s*/,""); }
  else if(/^-\s+/.test(t)){ type="sub"; t=t.replace(/^-\s+/,""); }
  if(/^\*\s*/.test(t)){ priority=true; t=t.replace(/^\*\s*/,""); }
  const m=t.match(/\s*\[(app|both)\]\s*$/i); if(m){ mode=m[1].toLowerCase(); t=t.slice(0,m.index); }
  return {id:newId(),text:t.trim(),type,priority,mode};
}
function secLine(line){ const t=line.replace(/^#\s*/,""), m=t.match(/^(.*?)\s+@\s*(.+)$/); return m?{name:m[1].trim(),assignee:m[2].trim()}:{name:t.trim(),assignee:""}; }
function parseChecklistText(text){
  const secs=[]; let cur=null;
  String(text||"").split(/\r?\n/).forEach(raw=>{ const line=raw.trim(); if(!line) return;
    if(/^#(?!#)\s*/.test(line)){ cur=Object.assign({id:newId(),items:[]},secLine(line)); secs.push(cur); return; }
    if(!cur){ cur={id:newId(),name:"Section 1",items:[]}; secs.push(cur); }
    const it=parseItemLine(line); if(it.text) cur.items.push(it); });
  return secs;
}

Object.assign(ui,{invPop:null, invPopPinned:false, invFocus:null, invFull:null, invTabInit:false, locSel:null, invGridDir:PREF.get("invGridDir","across")});

/* What the search, category and low-stock filters match, for the map */
function invMatch(){
  const words=ui.invQ.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const active=!!(words.length || ui.invCat || ui.invLow);
  const items=Object.values(S.inventory).filter(p=>{
    if(ui.invLow && !isLow(p)) return false;
    if(ui.invCat && p.category!==ui.invCat) return false;
    if(words.length){ const hay=[p.name,p.partNo,p.category,invLocLabel(p.locationId),p.notes].join(" ").toLowerCase(); if(!words.every(w=>hay.includes(w))) return false; }
    return true;
  }).sort(byName);
  const byLoc={}; items.forEach(p=>{ if(p.locationId && S.locations[p.locationId]) byLoc[p.locationId]=(byLoc[p.locationId]||0)+1; });
  const hits=new Set(Object.keys(byLoc));
  if(words.length && !ui.invCat && !ui.invLow) Object.values(S.locations).forEach(l=>{ const hay=(invLocLabel(l.id)+" "+(l.desc||"")).toLowerCase(); if(words.every(w=>hay.includes(w))) hits.add(l.id); });
  return {active, words, items, byLoc, hits};
}

let assetsCap; // undefined until checked
/* Photos live in the Supabase Storage bucket under their asset id. Only editors can add or remove them. */
async function getAssets(){
  if(assetsCap!==undefined) return assetsCap;
  if(Store.mode==="connecting") return null;
  assetsCap = (Store.mode==="live" && !me.readOnly) ? {
    async upload(blob,o){
      const id=(crypto.randomUUID?crypto.randomUUID():newId()+newId()).replace(/-/g,"");
      const {error}=await sb.storage.from(PHOTO_BUCKET).upload(id, blob, {contentType:(o&&o.type)||blob.type||"image/jpeg", upsert:false});
      if(error){ const st=Number(error.statusCode||error.status)||0;
        throw {code: st===413?"too_large" : st===415||/mime|type/i.test(error.message||"")?"unsupported_type" : st===429?"rate_limited" : st===401||st===403?"not_granted" : /fetch|network/i.test(error.message||"")?"store_unavailable" : "failed", cause:error}; }
      return {id, url:""};
    },
    async delete(id){ const {error}=await sb.storage.from(PHOTO_BUCKET).remove([String(id)]); if(error) throw error; }
  } : null;
  return assetsCap;
}

/* One part row. In a sheet, actions use data-s (the page-wide click handler ignores sheets). */
/* A web link the user typed: adds https:// if missing; "" when empty; null when it isn't a usable http(s) address. */
function cleanUrl(s){
  s=String(s||"").trim(); if(!s) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s)) s="https://"+s;
  try{ const u=new URL(s); return (u.protocol==="http:"||u.protocol==="https:") && u.hostname.includes(".") ? u.href : null; }catch(e){ return null; }
}
const partLink = p => { const u=cleanUrl(p.url); return u ? `<a class="btn sm plink" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Open part info for ${esc(p.name)} in a new tab">${INV_LINK}Part info</a>` : ""; };
function partRow(p,o){

  return `<li class="part ${low?"low":""}">

      <span class="meta">${p.partNo?`<span class="pno">${esc(p.partNo)}</span>`:""}${p.category?`<span>${esc(p.category)}</span>`:""}${low?`<span class="pill warn">Low · min ${esc(p.min)}</span>`:""}</span></button>
    <div class="qty"><button ${qa(-1)} aria-label="One less ${esc(p.name)}">−</button><span class="n">${n}<small>on hand</small></span><button ${qa(1)} aria-label="One more ${esc(p.name)}">+</button></div>${locHtml}</li>`;
}

  });

      ${noLoc?`<div class="row"><span class="muted">${noLoc} part${noLoc===1?" has":"s have"} no location.</span><button class="btn sm" data-inv="noloc">Show them</button></div>`:""}</div>` : "";
  fitInvMaps(); fitInvMaps(); // second pass settles header wrapping after a column change
  clampBinLabels($("#v-body"));
  if(ui.invPop && S.locations[ui.invPop]) showPop(ui.invPop, ui.invPopPinned); else hidePop(true);

/* Show as many lines of a bin's description as fit in its box, ending with "…" */
function clampBinLabels(root){
  $$(".ib-l.has-d",root||document).forEach(lb=>{
    const box=lb.parentElement, lh=parseFloat(getComputedStyle(lb).lineHeight)||16;
    const n=Math.max(1,Math.floor((box.clientHeight-6)/lh));
    lb.style.webkitLineClamp=String(n); lb.style.lineClamp=String(n); lb.style.maxHeight=(n*lh+2)+"px";
  });
}
/* Size the photos so the whole storage map fits on one screen (not on phones). */
function fitInvMaps(){
  const wrap=$("#v-body .invmaps"); if(!wrap) return;
  const fc=ui.invFull && wrap.querySelector(".invunit.full");
  if(fc){ // full screen: the photo fills the height left under the unit's header
    const st=fc.querySelector(".istage"), top=st.getBoundingClientRect().top-fc.getBoundingClientRect().top+fc.scrollTop;
    fc.style.setProperty("--fit", Math.max(160,Math.floor(window.innerHeight-top-parseFloat(getComputedStyle(fc).paddingBottom)-2))+"px"); }
  const stages=$$(".istage",wrap), n=stages.length;
  if(!n || window.matchMedia("(max-width:639px)").matches){ wrap.style.setProperty("--n","1"); wrap.style.removeProperty("--fit"); return; }
  // room left on screen below the first row's photos (minus a bottom tab bar, if any)
  const nav=$("#nav").getBoundingClientRect(), navH = nav.top>window.innerHeight/2 ? window.innerHeight-nav.top : 0;
  const card=stages[0].closest(".invunit"), cs=getComputedStyle(card);
  const padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+2, padB=parseFloat(cs.paddingBottom)+1;
  const top=Math.max(...stages.map(s=>s.getBoundingClientRect().top))+window.scrollY;
  const rowExtra=stages[0].getBoundingClientRect().top-card.getBoundingClientRect().top+padB+16; // header + padding + gap per extra row
  const H=window.innerHeight-navH-top-padB-12, W=wrap.clientWidth, gap=16;
  const ars=stages.map(s=>{ const v=String(s.style.getPropertyValue("--ar")||"4/3").split("/"); return (Number(v[0])/Number(v[1]))||4/3; });
  // try 1–3 columns; keep the one that gives the photos the most area
  let best={c:Math.min(3,n), h:H, area:-1};
  for(let c=1;c<=Math.min(3,n);c++){
    const rows=Math.ceil(n/c), colW=(W-(c-1)*gap)/c-padX, h=Math.max(160,(H-(rows-1)*rowExtra)/rows);
    const area=ars.reduce((s,ar)=>{ const w=Math.min(colW,h*ar); return s+w*(w/ar); },0);
    if(area>best.area*1.03) best={c,h,area};
  }
  wrap.style.setProperty("--n", String(best.c));
  wrap.style.setProperty("--fit", Math.max(160,Math.floor(best.h))+"px");
}
window.addEventListener("resize", ()=>{ if(ui.view==="inventory" && ui.invTab==="map"){ if(ui.invPop) hidePop(); fitInvMaps(); fitInvMaps(); clampBinLabels($("#v-body")); } });

function hidePop(keep){
  $$("#v-body .ipop").forEach(p=>{ p.hidden=true; p.innerHTML=""; p.classList.remove("pinned"); });
  $$("#v-body .ibox.pop").forEach(b=>b.classList.remove("pop"));

}
function showPop(id,pinned){
  const box=$(`#v-body .ibox[data-loc="${id}"]`); if(!box || !S.locations[id]){ hidePop(); return; }
  hidePop(true); ui.invPop=id; ui.invPopPinned=!!pinned;
  const wrap=box.closest(".istage-wrap"), pop=wrap.querySelector(".ipop");
  pop.innerHTML=popHtml(id); pop.hidden=false; pop.classList.toggle("pinned",!!pinned); box.classList.add("pop");
  if(window.matchMedia("(min-width:640px)").matches){
    const wr=wrap.getBoundingClientRect(), br=box.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=br.right-wr.left+10, top=br.top-wr.top;
    if(left+pw>wr.width) left=br.left-wr.left-pw-10;
    if(left<0){ left=clamp(br.left-wr.left,0,Math.max(0,wr.width-pw)); top=br.bottom-wr.top+8; }
    else top=clamp(top,0,Math.max(0,wr.height-ph));
    pop.style.left=left+"px"; pop.style.top=top+"px";
  } else { pop.style.left=""; pop.style.top=""; if(pinned) pop.scrollIntoView({block:"nearest"}); }
}
function invFocus(id){

function invAction(a){
  const k=a.dataset.inv, id=a.dataset.id;
  switch(k){
    case "tab": ui.invTab=a.dataset.v; ui.locSel=null; if(ui.invFull) invFullClose(true); PREF.set("invTab",ui.invTab); hidePop(); render(); break;
    case "order": orderSheet(); break;
    case "loc-select": ui.locSel=new Set(); render(); break;
    case "loc-select-done": ui.locSel=null; render(); break;
    case "loc-pick": if(ui.locSel){ ui.locSel.has(id)?ui.locSel.delete(id):ui.locSel.add(id); render(); } break;
    case "loc-pick-group": if(ui.locSel){ const ids=String(a.dataset.ids||"").split(",").filter(Boolean), all=ids.every(x=>ui.locSel.has(x)); ids.forEach(x=>all?ui.locSel.delete(x):ui.locSel.add(x)); render(); } break;
    case "loc-rename": if(ui.locSel && ui.locSel.size) bulkRenameSheet([...ui.locSel]); break;
    case "loc-del": if(ui.locSel && ui.locSel.size) bulkDeleteLocations([...ui.locSel]).then(ok=>{ if(ok){ ui.locSel=new Set(); render(); } }); break;
    case "low": ui.invLow=!ui.invLow; hidePop(); render(); break;
    case "clear": { ui.invQ=""; ui.invCat=""; ui.invLow=false; ui.invLoc=""; const q=$("#inv-q"); if(q) q.value=""; hidePop(); render(); break; }
    case "noloc": ui.invTab="parts"; ui.invLoc="__none"; ui.invQ=""; ui.invCat=""; ui.invLow=false; { const q=$("#inv-q"); if(q) q.value=""; } render(); break;
    case "add-unit": unitSheet(); break;
    case "edit-map": mapEditor(id); break;
    case "full": invFullOpen(id); break;
    case "full-exit": invFullClose(); break;
    case "focus": invFocus(id); break;
    case "show-on-map": ui.invTab="map"; PREF.set("invTab","map"); hidePop(); render(); invFocus(id); break;
    case "open-bin": binSheet(id); break;
    case "move": moveSheet(id); break;
    case "pop-close": hidePop(); break;
    case "part": partSheet(id); break;
  }
}

function lamVersion(cl){ let v=0; Object.values(S.prints).forEach(p=>{ if(p.checklistId===cl.id) v=Math.max(v,Number(p.version)||0); }); return v; }
/* ---- section assignments: checklists/{id}.sections[].assignee = name (same person every match).

function clAssign(cl){ const o={}; ((cl&&cl.sections)||[]).forEach(sec=>{ const v=String(sec.assignee==null?"":sec.assignee).trim(); if(v) o[sec.id]=v; }); return o; }
function runAssign(run){ return clAssign(run&&S.checklists[run.checklistId]); }
function legacyAssign(clId){ const r=runsSorted().find(x=>x.checklistId===clId && x.assign && Object.values(x.assign).some(v=>String(v||"").trim())); if(!r) return null; const o={}; for(const k in r.assign){ const v=String(r.assign[k]||"").trim(); if(v) o[k]=v; } return {label:r.label, map:o}; }

  Object.values(S.runs).forEach(r=>Object.values(r.assign||{}).forEach(v=>{ v=String(v||"").trim(); if(v) set.add(v); }));

/* ---- delete old match checklists (runs + their scans) ---- */
function delRunsSheet(){
  const runs=runsSorted(), cur=activeRun();
  if(!runs.length){ toast("There are no match checklists to delete."); return; }
  const sel=new Set(runs.filter(r=>!cur||r.id!==cur.id).map(r=>r.id));
  const row=r=>{ const x=runState(r), n=Object.values(S.scans).filter(sc=>sc.runId===r.id).length, on=sel.has(r.id);
    return `<button type="button" class="tick ${on?"done":""}" data-rid="${r.id}" aria-pressed="${on}"><span class="box">${on?ICON.check:""}</span><span class="txt">${esc(r.label)}${cur&&r.id===cur.id?` <span class="pill brand">Showing now</span>`:""}</span><span class="by">${x?(x.verified?"Verified":x.pct+"% done"):"Checklist deleted"} · started ${fmtDay(r.createdAt)} ${fmtClock(r.createdAt)}${n?` · ${n} scan${n===1?"":"s"}`:""}</span></button>`; };
  openSheet({title:"Delete old checklists", body:`<div class="form">
      <p class="muted">Tick the match checklists to delete. Their paper-scan results go too. Repairs logged from them stay in Repairs, and your season checklists are not touched.</p>
      <div class="row"><button type="button" class="btn sm" data-q="old">Pick all but the one showing</button><button type="button" class="btn sm" data-q="ver">Pick verified only</button><button type="button" class="btn sm ghost" data-q="none">Clear picks</button></div>
      <div class="attn delruns">${runs.map(row).join("")}</div></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn danger" data-s="del"></button>`,
    onMount(el){
      const paint=()=>{ el.querySelectorAll("[data-rid]").forEach(b=>{ const on=sel.has(b.dataset.rid); b.classList.toggle("done",on); b.setAttribute("aria-pressed",String(on)); b.querySelector(".box").innerHTML=on?ICON.check:""; });
        const d=el.querySelector('[data-s="del"]'); d.disabled=!sel.size; d.innerHTML=`${ICON.trash}${sel.size?`Delete ${sel.size} checklist${sel.size===1?"":"s"}`:"Pick checklists to delete"}`; };
      paint();
      el.addEventListener("click",async e=>{
        const t=e.target.closest("[data-rid]"); if(t){ const id=t.dataset.rid; sel.has(id)?sel.delete(id):sel.add(id); paint(); return; }
        const q=e.target.closest("[data-q]"); if(q){ sel.clear();
