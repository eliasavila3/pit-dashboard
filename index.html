          paint(); return; }
        if(!e.target.closest('[data-s="del"]') || !sel.size) return;
        const ids=[...sel]; closeSheet(); await deleteRuns(ids);
      }); } });
}
async function deleteRuns(ids){
  ids=ids.filter(id=>S.runs[id]); if(!ids.length) return false;
  const scans=Object.values(S.scans).filter(sc=>ids.includes(sc.runId));
  const names=ids.map(id=>S.runs[id].label).slice(0,4).join(", ")+(ids.length>4?` and ${ids.length-4} more`:"");
  if(!(await confirmBox(`Delete ${ids.length} match checklist${ids.length===1?"":"s"} (${names})${scans.length?` and ${scans.length} paper scan${scans.length===1?"":"s"}`:""}? This can't be undone.`,`Delete ${ids.length}`))) return false;
  const s=settings(), activeGone=!s.activeRunId || ids.includes(s.activeRunId);
  const picIds=ids.flatMap(id=>Object.values(S.runs[id].pics||{}).map(p=>p&&p.id).filter(Boolean));
  const ok=await writeMany(scans.map(sc=>["scans",sc.id,"delete"]).concat(ids.map(id=>["runs",id,"delete"])));
  if(picIds.length){ const A=await getAssets(); if(A) picIds.forEach(pid=>{ try{ A.delete(pid).catch(()=>{}); }catch(e){} }); }
  if(activeGone){ const next=runsSorted()[0]; setActiveRun(next?next.id:null); }
  if(ok) toast(`Deleted ${ids.length} match checklist${ids.length===1?"":"s"}`);
  render(); return ok;
}

/* Files go out as normal browser downloads */
const downloads = { async save({filename,data}){
  const blob = data instanceof Blob ? data : new Blob([data], {type:/\.csv$/i.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
} };

/* ---- printable PDF ---- */
let pdfLib=null;
function loadPdfLib(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  if(pdfLib) return pdfLib;
  pdfLib=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload=()=>res(window.jspdf); s.onerror=()=>{ pdfLib=null; rej(new Error("load")); }; document.head.appendChild(s); });
  return pdfLib;
}
function buildPdf(cl,N,matchLabel,assign,measure){
  assign=Object.assign({},clAssign(cl),assign||{}); buildPdf.small=[];
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
  const W=612,H=792,M=36,TOP=112,BOTTOM=H-56, code=(cl.code||"")+"-v"+(cl.version||1);
  const clean=s=>String(s==null?"":s).replace(/[‘’′]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[^\x20-\x7E\xA0-\xFF]/g,"?");
  const brand=[0,36,255];
  let y=TOP;
  function field(label,x,yy,w,v){ doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(0); doc.text(label,x,yy); const lw=doc.getTextWidth(label)+6; doc.setDrawColor(0); doc.setLineWidth(.7); doc.line(x+lw,yy+3,x+w,yy+3); if(v){ doc.setFontSize(14); doc.text(clean(v),x+lw+6,yy); } }
  function header(s){
    try{ doc.addImage(WORD_PNG,"PNG",M,26,122,32); }catch(e){}
    doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(0);
    const QS=70, qx=W-M-QS, qy=12, tr=s&&window.qrcode?qx-14:W-M;
    doc.text(clean(`${cl.year} ${cl.name}`),tr,40,{align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(50);
    doc.text(clean((cl.game?cl.game+"   |   ":"")+"Sheet "+code+(s?"   |   Page "+s.sNo:"")),tr,54,{align:"right"});
    if(s && window.qrcode){ const q=window.qrcode(0,"M"); q.addData(clQrText(cl,s.sNo)); q.make();
      const n=q.getModuleCount(), cell=QS/n; doc.setFillColor(0,0,0);
      for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) doc.rect(qx+k*cell,qy+r*cell,cell+0.15,cell+0.15,"F"); }
    const who=s?String(assign[s.sec.id]||"").trim():"";
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(60); doc.text("ASSIGNED TO:",M,86);
    const lx=M+doc.getTextWidth("ASSIGNED TO:")+10;
    if(who){ doc.setFontSize(20); doc.setTextColor(0); doc.text(clean(who),lx,87); }
    else { doc.setDrawColor(0); doc.setLineWidth(.7); doc.line(lx,89,M+300,89); }
    doc.setDrawColor(...brand); doc.setLineWidth(2); doc.line(M,96,W-M,96);
  }
  function star(cx,cy,r){ const pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]); }
    const segs=pts.slice(1).map((p,i)=>[p[0]-pts[i][0],p[1]-pts[i][1]]); doc.setFillColor(0,0,0); doc.lines(segs,pts[0][0],pts[0][1],[1,1],"F",true); }
  function layout(text,maxW,size){
    doc.setFontSize(size); const words=clean(text).split(/\s+/).filter(Boolean), lines=[[]]; let w=0;
    doc.setFont("helvetica","normal"); const sp=doc.getTextWidth(" ");
    words.forEach(word=>{ const bold=isCaps(word); doc.setFont("helvetica",bold?"bold":"normal"); const ww=doc.getTextWidth(word); const cur=lines[lines.length-1];
      if(cur.length && w+sp+ww>maxW){ lines.push([{t:word,bold,w:ww}]); w=ww; } else { cur.push({t:word,bold,w:ww}); w+=(cur.length>1?sp:0)+ww; } });
    return {lines,sp};
  }
  function drawLines(L,x,yy,lh){ L.lines.forEach((ln,i)=>{ let cx=x; ln.forEach((sg,j)=>{ if(j) cx+=L.sp; doc.setFont("helvetica",sg.bold?"bold":"normal"); doc.text(sg.t,cx,yy+i*lh); cx+=sg.w; }); }); }
  function secHead(s,cont){
    doc.setFillColor(232,236,252); doc.rect(M,y,W-2*M,22,"F");
    doc.setFillColor(...brand); doc.rect(M,y,26,22,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255); doc.text(String(s.sNo),M+13,y+15.5,{align:"center"});
    doc.setTextColor(0); doc.text(clean(s.sec.name).toUpperCase()+(cont?"  (continued)":""),M+36,y+15.5);
    y+=28;
  }
  /* Every section starts on its own page and never continues onto the next one.
     A long section is drawn smaller (k < 1) until it fits on its page. */
  const AVAIL=BOTTOM-TOP-28;
  const geo=(it,k)=>{ const sub=it.type==="sub", bx=sub?M+26:M+4, nx=bx+26, tx=nx+(sub?38:34); return {bx,nx,tx,maxW:W-M-22-tx}; };
  function rowH(it,k){ if(it.type==="heading") return 18*k; const L=layout(it.text,geo(it,k).maxW,10.5*k); return Math.max(26*k,L.lines.length*13*k+11*k); }
  const secs=N.secs.filter(s=>s.sNo);
  secs.forEach((s,si)=>{
    const rows=s.rows.filter(r=>printed(r.it) && String(r.it.text||"").trim());
    if(si) doc.addPage();
    header(s); y=TOP; secHead(s,false);
    let k=1; const need=kk=>rows.reduce((t,r)=>t+rowH(r.it,kk),0);
    while(k>0.3 && need(k)>AVAIL) k=Math.round((k-0.04)*100)/100;
    if(k<0.62) buildPdf.small.push(s.sec.name);
    const SZ=10.5*k, LH=13*k, B=Math.max(10,18*k); /* larger boxes for dry-erase markers */
    rows.forEach(r=>{
      const it=r.it;
      if(it.type==="heading"){
        doc.setFont("helvetica","bold"); doc.setFontSize(Math.max(6.5,9*k)); doc.setTextColor(70); doc.text(clean(it.text).toUpperCase(),M+4,y+11*k); y+=18*k; doc.setTextColor(0); return;
      }
      const g=geo(it,k), L=layout(it.text,g.maxW,SZ), h=Math.max(26*k,L.lines.length*LH+11*k), by=y+Math.max(0,(Math.min(h,26*k)-B)/2);
      if(measure) measure[it.id]={p:String(s.sNo), x:g.bx+B/2, y:by+B/2, top:y, h};
      doc.setDrawColor(0); doc.setLineWidth(1.1); doc.rect(g.bx,by,B,B);
      doc.setFont("helvetica","bold"); doc.setFontSize(Math.max(7,9*k)); doc.setTextColor(60); doc.text(r.no,g.nx,by+B*0.78);
      doc.setTextColor(0); doc.setFontSize(SZ); drawLines(L,g.tx,by+B*0.78,LH);
      if(it.priority) star(W-M-9,by+B/2,Math.max(4,6*k));
      doc.setDrawColor(215); doc.setLineWidth(.5); doc.line(M,y+h-1,W-M,y+h-1);
      y+=h;
    });
  });
  if(measure) return measure;
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(60);
    doc.text("Dry-erase marker only. Mark each box when done, leave it blank if not. Scan every page in the pit app, then wipe it clean.",M,H-34);
    star(M+4,H-22,4.5); doc.text("= priority item",M+12,H-19);
    doc.setFont("helvetica","bold"); doc.text(clean(`Sheet ${code}   |   Page ${i} of ${n}`),W-M,H-19,{align:"right"}); }
  return doc.output("blob");
}
async function printChecklist(cl,matchLabel,assign){
  if(!cl) return;
  const N=numberCl(cl);
  if(!N.printedCount){ toast("Nothing to print yet. Add items set to Paper or Paper + app.","bad"); return; }
  const key=(cl.code||"X")+"-v"+(cl.version||1);
  if(!S.prints[key]) write("prints",key,"set",{checklistId:cl.id,version:cl.version||1,rows:Object.entries(N.map),createdAt:now()});
  toast("Building the PDF…");
  const dl=downloads;
  let blob; try{ await loadPdfLib(); await loadQr(); blob=buildPdf(cl,N,matchLabel||"",assign||{}); }catch(e){ console.error(e); toast("Couldn't build the PDF (the PDF or QR code tool didn't load). Check the connection and try again.","bad"); return; }
  const fname=`${cl.year} ${cl.name} - laminate (v${cl.version||1}).pdf`.replace(/[\\/:*?"<>|]/g,"-");
  const small=buildPdf.small||[];
  try{ await dl.save({filename:fname,data:blob}); toast(small.length?`PDF saved. ${small.join(", ")} ${small.length===1?"has":"have"} so many items the text is small. Split ${small.length===1?"it":"them"} into two sections in Build & print to make it bigger.`:"PDF saved. One section per page. Print once at 100% scale and laminate the pages.", small.length?"bad":""); }
  catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"A save is already waiting for you to confirm.":"Couldn't save the PDF here.","bad"); }

function scanPrompt(cl,N){

Each page holds one section and has a QR code in its top right corner (ignore it). Photos are turned upright before you see them; if a page still looks rotated, read it in its correct orientation.
Each row has its own square checkbox at the left, then an item number like 3.4 or 3.4a, then the item text. Sub-items (numbers with a letter, like 2.7a) have their own smaller, indented box: judge it separately from the row above.
A row is DONE when any part of a deliberate marker stroke (a check, tick, X, scribble, fill or initials) is INSIDE its checkbox. It still counts when most of the stroke is outside the box: ticks are often small, sit high in the box, or have a long tail running out of the box, across a row line or toward a neighbouring row's number or text.
A row is BLANK only when the inside of its checkbox is clearly empty: bare paper, at most with faint grey smudges, ghosting or streaks left from wiping an earlier match (those are not marks).
Use UNCLEAR when glare from the lamination, a reflection, a finger, blur or the page edge hides the box; when you cannot tell a fresh mark from an old smudge; or when a stroke near the box might belong to this row or a neighbouring row and you can't tell if it reaches inside this box.
If you are unsure between DONE and BLANK, answer UNCLEAR, never BLANK. A mark in one box never decides a neighbouring box.
The sheet code is printed at the top right after the word "Sheet" (for example ${cl.code}-v${cl.version||1}). "Assigned to:" at the top of each page is printed. The match is chosen in the app, not written on the sheet.

The items on the current version of this checklist (number | text):
`;
  N.secs.forEach(sc=>{ if(!sc.sNo) return; s+=`\n## ${sc.sNo} ${sc.sec.name}\n`; sc.rows.forEach(r=>{ if(r.no) s+=`${r.no} | ${r.it.text}\n`; }); });

Report every numbered row that is visible in the photos, using the number printed on the sheet.
Reply with only JSON in this shape:
For every UNCLEAR or BLANK row also give "y": how far down its own photo that row's checkbox is, from 0 (top edge of the photo) to 1 (bottom edge), to two decimals.
{"sheet":"${cl.code}-v${cl.version||1}","items":[{"no":"1.1","state":"done"},{"no":"1.2","state":"blank","y":0.37},{"no":"1.2a","state":"unclear","y":0.41}],"notes":"handwritten notes on the pages, or an empty string"}`;

function qsSummary(){

function parseSchedule(text,dateStr){
  const [y,mo,da]=(dateStr||todayInput()).split("-").map(Number), out=[];
  text.split(/\n/).forEach(line=>{
    const tk=line.trim().split(/[\s,;|\t]+/).filter(Boolean); if(!tk.length) return;
    const first=tk[0].match(/^([PQMF])?(\d{1,3})$/i); if(!first) return;
    const type={p:"practice",q:"qual",m:"playoff",f:"final"}[(first[1]||"q").toLowerCase()];
    let time=null, alliance="", station="", teams=[];
    for(let i=1;i<tk.length;i++){
      const t=tk[i];
      let mm=t.match(/^(\d{1,2}):(\d{2})\s*(am|pm|a|p)?$/i);
      if(mm){ let h=Number(mm[1]); const ap=(mm[3]||(tk[i+1]&&/^(am|pm)$/i.test(tk[i+1])?tk[++i]:"")).toLowerCase(); if(ap.startsWith("p")&&h<12) h+=12; if(ap.startsWith("a")&&h===12) h=0; time=new Date(y,mo-1,da,h,Number(mm[2])).getTime(); continue; }
      mm=t.match(/^(red|blue|r|b)([1-3])?$/i); if(mm){ alliance=mm[1][0].toLowerCase()==="r"?"red":"blue"; station=mm[2]||""; continue; }
      if(/^\d{1,5}$/.test(t)) teams.push(t);
    }
    out.push({type,num:Number(first[2]),time,alliance,station,partners:[teams[0]||"",teams[1]||""],opponents:[teams[2]||"",teams[3]||"",teams[4]||""]});
  });
  return out;
}

        write("inventory",p?p.id:newId(),"set",Object.assign(base,{name,category:val(el,"pt-cat"),locationId:loc,qty:Math.max(0,Number(val(el,"pt-qty"))||0),min,restock,pack,notes:val(el,"pt-notes"),partNo:val(el,"pt-pno"),url,updatedAt:now()}));

/* Delete a location after confirming; its parts are kept with no location. */
async function deleteLocation(l){
  if(!l) return false;
  const n=Object.values(S.inventory).filter(p=>p.locationId===l.id).length;
  if(!(await confirmBox(`Delete ${l.name}?${n?` Its ${n} part${n===1?"":"s"} will show “No location”.`:""}`,"Delete location"))) return false;

/* Many writes, a few at a time, so the store isn't flooded. */
/* ---- order list: every low part, with how many to buy ---- */
function orderSheet(){
  const low=lowParts().slice().sort(byName);
  if(!low.length){ toast("Nothing is low right now. Give parts a low-stock level to have them show up here."); return; }
  const restockTo=p=>Number(p.restock)>0?Number(p.restock):(Number(p.min)||0)*2;  /* the part's Restock to, else twice its low level */
  const packOf=p=>Math.max(1,Math.round(Number(p.pack)||1));   /* parts per pack; none set = 1 */
  const sug=p=>Math.ceil(Math.max(1,restockTo(p)-(Number(p.qty)||0))/packOf(p));   /* whole packs that cover the shortfall */
  const amt=(p,q)=>packOf(p)>1?`${q} pack${q===1?"":"s"} of ${packOf(p)}`:String(q);
  const st={}; low.forEach(p=>st[p.id]={on:true,q:sug(p)});
  /* category filter: shown = low parts in the chosen category; Copy and Download use only those */
  const catOf=p=>p.category||"", cats=CATS.concat([...new Set(low.map(catOf))].filter(c=>c&&!CATS.includes(c)).sort()).filter(c=>low.some(p=>catOf(p)===c));
  if(low.some(p=>!catOf(p))) cats.push("");
  let cat=ui.ordCat!=null && cats.includes(ui.ordCat) ? ui.ordCat : null;
  const shown=()=>cat==null?low:low.filter(p=>catOf(p)===cat);
  const picked=()=>shown().filter(p=>st[p.id].on && st[p.id].q>0);
  const catOpts=()=>`<option value="__all" ${cat==null?"selected":""}>All categories (${low.length})</option>`+cats.map(c=>`<option value="${esc(c)}" ${cat===c?"selected":""}>${esc(c||"No category")} (${low.filter(p=>catOf(p)===c).length})</option>`).join("");
  const day=new Date().toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"});
  openSheet({title:`Order list · ${low.length} low`, body:`<p class="muted">Parts at or below their low-stock level. The amount brings each one up to its restock level (twice its low level if none is set), rounded up to whole packs. Change any amount, or untick parts you don't want to order.</p>

    foot:`<button class="btn" data-s="csv">Download spreadsheet</button><button class="btn primary" data-s="copy">${ICON.copy}Copy list</button>`,
    onMount(el){
      const list=el.querySelector("#ord-list");
      const draw=()=>{
        const sh=shown();
        list.innerHTML=sh.map(p=>{ const s=st[p.id], l=S.locations[p.locationId], u=cleanUrl(p.url);
          return `<li class="ord${s.on?"":" off"}"><label class="ordchk"><input type="checkbox" data-o="on" data-id="${p.id}" ${s.on?"checked":""} aria-label="Order ${esc(p.name)}"></label>
            <div class="ordmain"><b>${esc(p.name)}</b><span class="ordmeta">${p.partNo?`<span class="pno">${esc(p.partNo)}</span>`:""}<span>Have <b class="warnt">${Number(p.qty)||0}</b> · low at ${Number(p.min)||0} · restock to ${restockTo(p)}</span>${l?`<span>${esc(invLocLabel(l.id))}</span>`:""}${u?`<a class="plink" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${INV_LINK}Part info</a>`:""}</span></div>
            <div class="qty ordq"><button type="button" data-o="q" data-id="${p.id}" data-d="-1" aria-label="Order one${packOf(p)>1?" pack":""} less ${esc(p.name)}">−</button><span class="n">${s.q}<small>${packOf(p)>1?`pack${s.q===1?"":"s"} of ${packOf(p)}`:"to order"}</small></span><button type="button" data-o="q" data-id="${p.id}" data-d="1" aria-label="Order one${packOf(p)>1?" pack":""} more ${esc(p.name)}">+</button></div></li>`; }).join("");
        const n=picked().length; el.querySelector("#ord-sum").textContent=`${n} of ${sh.length} ${cat==null?"":(cat||"uncategorized")+" "}part${sh.length===1?"":"s"} on the order.`;
        el.querySelectorAll('[data-s="copy"],[data-s="csv"]').forEach(b=>b.disabled=!n);
      };
      draw();
      el.addEventListener("change",e=>{
        if(e.target.id==="ord-cat"){ const v=e.target.value; cat=v==="__all"?null:v; ui.ordCat=cat; draw(); el.querySelector(".sheet-body").scrollTop=0; return; }
        const c=e.target.closest('[data-o="on"]'); if(c){ st[c.dataset.id].on=c.checked; draw(); } });
      el.addEventListener("click",async e=>{

        if(q){ const s=st[q.dataset.id]; s.q=Math.max(0,s.q+Number(q.dataset.d)); if(!s.q) s.on=false; else s.on=true; draw(); return; }
        const b=e.target.closest("[data-s]"); if(!b || b.disabled) return;
        const rows=picked();
        if(b.dataset.s==="copy"){
          const txt=`Team ${settings().team||"1323"} order list${cat==null?"":" · "+(cat||"No category")} · ${day}\n`+rows.map(p=>{ const u=cleanUrl(p.url);
            const q=st[p.id].q, k=packOf(p);
            return `${k>1?`${amt(p,q)} × `:`${q} × `}${p.name}${p.partNo?` (${p.partNo})`:""}${k>1?` · ${q*k} total`:""} · have ${Number(p.qty)||0}${u?` · ${u}`:""}`; }).join("\n");
          try{ await navigator.clipboard.writeText(txt); toast(`Copied ${rows.length} part${rows.length===1?"":"s"}`); }
          catch(err){ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.minHeight="220px"; el.querySelector(".sheet-body").appendChild(ta); ta.focus(); ta.select(); toast("Select all and copy the text below."); }
          return;
        }
        if(b.dataset.s==="csv"){
          const dl=downloads;
          const cell=v=>{ v=String(v==null?"":v); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
          const csv=[["Part","Part number","Packs to order","Pack size","Parts ordered","On hand","Low-stock level","Restock to","Category","Location","Link"]].concat(rows.map(p=>[p.name,p.partNo||"",st[p.id].q,packOf(p),st[p.id].q*packOf(p),Number(p.qty)||0,Number(p.min)||0,restockTo(p),p.category||"",invLocLabel(p.locationId),cleanUrl(p.url)||""])).map(r=>r.map(cell).join(",")).join("\r\n");
          const d=new Date(), fn=`Order list ${cat==null?"":(cat||"No category").replace(/&/g,"and").replace(/[\\/:*?"<>|]/g,"")+" "}${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.csv`;
          try{ await dl.save({filename:fn,data:"\ufeff"+csv}); toast("Spreadsheet saved"); }
          catch(err){ if(err&&err.code==="declined") return; toast(err&&err.code==="rate_limited"?"A save is already waiting for you to confirm.":"Couldn't save the file here. Use Copy list instead.","bad"); }
        }
      });
    }});
}

/* ---- several locations at once ---- */
/* Rows of locations in reading order: per storage unit, top to bottom, then left to right. Off-map ones go last, by name. */
function locReadingOrder(ids,dir){
  const L=ids.map(id=>S.locations[id]).filter(Boolean), rows=[], byUnit={};
  L.filter(onMap).forEach(l=>(byUnit[l.unitId]||(byUnit[l.unitId]=[])).push(l));
  // across: group into rows (top to bottom), each left to right. down: group into columns (left to right), each top to bottom.
  const down=dir==="down", c=b=>down?b.x+b.w/2:b.y+b.h/2, size=b=>down?b.w:b.h, along=b=>down?b.y:b.x;
  unitsSorted().forEach(u=>{ const arr=byUnit[u.id]; if(!arr) return;
    arr.sort((a,b)=>c(a.box)-c(b.box));
    const rs=[]; arr.forEach(l=>{ const cy=c(l.box), r=rs[rs.length-1];
      if(r && Math.abs(cy-r.cy)<Math.min(r.h,size(l.box))/2) r.items.push(l); else rs.push({cy,h:size(l.box),items:[l]}); });
    rs.forEach(r=>rows.push(r.items.sort((a,b)=>along(a.box)-along(b.box))));
  });
  const rest=L.filter(l=>!onMap(l)).sort(byName); if(rest.length) rows.push(rest);
  return rows;
}
function bulkRenameSheet(ids,back){
  let dir=ui.invGridDir||"across", rows=locReadingOrder(ids,dir), flat=rows.flat(); const n=flat.length; if(!n) return;
  const leave=()=>{ if(back) back(); else closeSheet(); };
  openSheet({title:`Rename ${n} location${n===1?"":"s"}`, body:`<div class="form">
      <div class="field"><span>New names</span>${seg("br-style",[["letters","Rows A, B, C… (A1, A2)"],["numbers","Numbered 1, 2, 3…"],["replace","Find & replace"]],"letters")}</div>
      <div class="field" id="br-dirf"><span>Number direction</span>${seg("br-dir",[["across","→ Left to right"],["down","↓ Top to bottom"]],dir)}</div>
      <div class="grid2" id="br-seq"><label class="field"><span>Name prefix</span><input type="text" id="br-prefix" placeholder="Optional, e.g. Bin, Drawer"></label><label class="field"><span>Start at</span><input type="text" id="br-start" value="A"></label></div>
      <div class="grid2" id="br-rep" hidden><label class="field"><span>Find</span><input type="text" id="br-find" placeholder="e.g. Bin"></label><label class="field"><span>Replace with</span><input type="text" id="br-with" placeholder="Leave empty to remove it"></label></div>
      <small class="muted" id="br-note"></small>
      <p id="br-msg" style="font-weight:600"></p><ul class="brprev" id="br-prev"></ul></div>`,
    foot:`<button class="btn" data-s="cancel">Cancel</button><button class="btn primary" data-s="go" id="br-go">Rename</button>`,
    onMount(el){
      let style="letters";
      const plan=()=>{
        const pre=val(el,"br-prefix"), p=pre?pre+" ":""; let list;
        if(style==="replace"){ const f=el.querySelector("#br-find").value; if(!f) return {err:"Enter the text to find."};
          const w=el.querySelector("#br-with").value; list=flat.map(l=>({l,name:String(l.name).split(f).join(w).replace(/\s+/g," ").trim()})); }
        else if(style==="letters"){ const s=(val(el,"br-start")||"A").toUpperCase().charCodeAt(0)-65;
          if(!(s>=0&&s<26)) return {err:"Start at must be a letter A–Z."}; if(s+rows.length>26) return {err:`That runs past Z. Start at an earlier letter or select fewer ${dir==="down"?"columns":"rows"}.`};
          list=[]; rows.forEach((r,ri)=>r.forEach((l,ci)=>list.push({l,name:p+String.fromCharCode(65+s+ri)+(ci+1)}))); }
        else { const s=parseInt(val(el,"br-start"),10); if(!(s>=0)) return {err:"Start at must be a number."}; list=flat.map((l,i)=>({l,name:p+(s+i)})); }
        if(list.some(x=>!x.name)) return {err:"That would leave a location with no name."};
        return {list};
      };
      const draw=()=>{
        el.querySelector("#br-seq").hidden=style==="replace"; el.querySelector("#br-rep").hidden=style!=="replace"; el.querySelector("#br-note").hidden=style==="replace"; el.querySelector("#br-dirf").hidden=style==="replace";
        el.querySelector("#br-note").textContent = dir==="down" ? (style==="letters"?"Each column on the photo gets a letter, numbered top to bottom (A1, A2, A3 down the first column).":"Numbered down each column, then the next column to the right.")
          : (style==="letters"?"Each row on the photo gets a letter, numbered left to right (A1, A2, A3 across the top row).":"Numbered across each row, then the next row down.");
        const r=plan(), msg=el.querySelector("#br-msg"), go=el.querySelector("#br-go"), prev=el.querySelector("#br-prev");
        if(r.err){ msg.innerHTML=`<span class="warnt">${esc(r.err)}</span>`; prev.innerHTML=""; go.disabled=true; go.textContent="Rename"; return; }
        const changed=r.list.filter(x=>x.name!==x.l.name), mine=new Set(flat.map(l=>l.id));
        const taken=new Set(Object.values(S.locations).filter(l=>!mine.has(l.id)).map(l=>(l.unitId||"")+"|"+String(l.name).toLowerCase()));
        const dup=r.list.filter(x=>taken.has((x.l.unitId||"")+"|"+x.name.toLowerCase())).map(x=>x.name);
        msg.innerHTML=`${changed.length} of ${n} will change.`+(dup.length?` <span class="warnt">Already used: ${esc(dup.slice(0,4).join(", "))}${dup.length>4?"…":""}.</span>`:"");
        prev.innerHTML=r.list.slice(0,60).map(x=>`<li><span class="o">${esc(x.l.name)}</span>→<span><b>${esc(x.name)}</b></span></li>`).join("")+(r.list.length>60?`<li><span class="o">+${r.list.length-60} more</span></li>`:"");
        go.disabled=!changed.length; go.textContent=changed.length?`Rename ${changed.length}`:"Nothing to change";
      };
      draw();
      el.addEventListener("input",draw);
      el.addEventListener("click",async e=>{
        const db=e.target.closest('.seg[data-name="br-dir"] button');
        if(db){ dir=db.dataset.v; ui.invGridDir=dir; PREF.set("invGridDir",dir); rows=locReadingOrder(ids,dir); flat=rows.flat(); draw(); return; }
        const sb=e.target.closest('.seg[data-name="br-style"] button');
        if(sb){ const prevStyle=style; style=sb.dataset.v; const st=el.querySelector("#br-start");
          if(prevStyle!==style && style==="letters" && !/^[A-Za-z]$/.test(st.value.trim())) st.value="A";
          if(prevStyle!==style && style==="numbers" && !/^\d+$/.test(st.value.trim())) st.value="1";
          draw(); return; }
        const b=e.target.closest("[data-s]"); if(!b || b.disabled) return;
        if(b.dataset.s==="cancel"){ leave(); return; }
        if(b.dataset.s!=="go") return;
        const r=plan(); if(r.err) return;
        const ops=r.list.filter(x=>x.name!==x.l.name).map(x=>["locations",x.l.id,"update",{name:x.name,updatedAt:now()}]);
        b.disabled=true; b.textContent="Renaming…";

      });
    }});
}
/* Delete several locations after one confirmation; their parts are kept with no location. */
async function bulkDeleteLocations(ids){
  const L=ids.map(id=>S.locations[id]).filter(Boolean); if(!L.length) return false;
  const set=new Set(L.map(l=>l.id)), parts=Object.values(S.inventory).filter(p=>set.has(p.locationId));
  const names=L.slice(0,5).map(l=>l.name).join(", ")+(L.length>5?` and ${L.length-5} more`:"");
  if(!(await confirmBox(`Delete ${L.length} location${L.length===1?"":"s"} (${names})?${parts.length?` ${parts.length} part${parts.length===1?"":"s"} stored there will show “No location”.`:""} This can't be undone.`,`Delete ${L.length}`))) return false;
  const ok=await writeMany(parts.map(p=>["inventory",p.id,"update",{locationId:""}]).concat(L.map(l=>["locations",l.id,"delete"])));

  return ok;

async function writeMany(ops){
  for(let i=0;i<ops.length;i++){ if(!write(...ops[i])) return false; if(i%6===5) await sleep(220); }
  return true;
}

        if(b.dataset.s!=="go") return;
        let to=sel.value; if(!to) return;
        const pick=its.filter(p=>on.has(p.id) && S.inventory[p.id] && S.inventory[p.id].locationId===fromId);
        if(!pick.length){ toast("Those parts have already moved.","bad"); return; }
        if(to==="__new"){ const ln=val(el,"mv-new"); if(!ln){ toast("Name the new location.","bad"); return; }
          to=newId(); if(!write("locations",to,"set",Object.assign(stamp({createdAt:now()}),{name:ln,desc:"",details:""}))) return; }
        else if(!S.locations[to]){ toast("That location was just deleted. Choose another.","bad"); return; }
        b.disabled=true; b.textContent="Moving…";
        if(await writeMany(pick.map(p=>["inventory",p.id,"update",{locationId:to,updatedAt:now()}]))){
          toast(`Moved ${pick.length} part${pick.length===1?"":"s"} to ${S.locations[to]?S.locations[to].name:"the new location"}`); binSheet(to); }
        else { b.disabled=false; draw(); }
      });
    }});
}

/* ---- storage units (front-view photos) ---- */
async function shrinkImage(file,max){
  max=max||2400; const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86)); if(!blob) throw new Error("encode");
    return {blob,w,h};
  } finally { URL.revokeObjectURL(url); }
}
function uploadMsg(e){
  const c=e&&e.code;
  return c==="too_large"?"That photo is too big. Try a smaller one."
    : c==="unsupported_type"?"Use a JPG or PNG photo."
    : c==="quota_or_state"?"The board's photo storage is full."
    : c==="rate_limited"?"Too many uploads at once. Wait a minute and try again."
    : (c==="not_granted"||c==="capability_disabled"||c==="capability_removed")?"Photo upload isn't available here."
    : c==="upstream_auth"?"Couldn't upload. Reload the page and try again."
    : "Couldn't upload the photo. Check the connection and try again.";
}
async function uploadPhoto(file){
  const cap=await getAssets(); if(!cap) throw new Error("Photo upload isn't available here.");
  let img; try{ img=await shrinkImage(file); }catch(e){ throw new Error("Couldn't read that photo. Try a JPG or PNG."); }
  const up=()=>cap.upload(img.blob,{type:"image/jpeg"});
  let r;
  try{ r=await up(); }
  catch(e){ if(e&&e.code==="store_unavailable"){ await sleep(900); try{ r=await up(); }catch(e2){ throw new Error(uploadMsg(e2)); } } else throw new Error(uploadMsg(e)); }
  return {id:r.id, w:img.w, h:img.h};
}

      }
      /* grid naming */
      function gridOpts(){
        const rows=clamp(parseInt(val(el,"me-rows"),10)||1,1,26), cols=clamp(parseInt(val(el,"me-cols"),10)||1,1,40);
        return {rows, cols, style:segVal(el,"me-style")||"letters", dir:segVal(el,"me-dir")||"across", prefix:val(el,"me-prefix"), start:val(el,"me-start"), sec:segVal(el,"me-sec")};

      function autoStart(sec,style,prefix){
        const names=Object.values(S.locations).filter(l=>l.unitId===unitId && (l.section||"")===sec).map(l=>String(l.name).trim());
        const p=escRe(prefix.trim());
        if(style==="letters"){ let max=-1; const re=new RegExp("^"+p+"\\s*([A-Z])\\d+$","i"); names.forEach(n=>{ const m=n.match(re); if(m) max=Math.max(max,m[1].toUpperCase().charCodeAt(0)-65); }); return String.fromCharCode(65+Math.min(25,max+1)); }
        let max=0; const re=new RegExp("^"+p+"\\s*(\\d+)$","i"); names.forEach(n=>{ const m=n.match(re); if(m) max=Math.max(max,Number(m[1])); }); return String(max+1);
      }
      function gridCells(){
        const g=gridOpts(), d=st.draft, pre=g.prefix?g.prefix.trim()+" ":"", out=[];
        let err="";

          else if(s+(g.dir==="down"?g.cols:g.rows)>26) err=`That runs past Z. Start at an earlier letter or use fewer ${g.dir==="down"?"columns":"rows"}.`;
          // across: each row is a letter, numbered left to right (A1 A2 A3). down: each column is a letter, numbered top to bottom.
          for(let r=0;r<g.rows&&!err;r++) for(let c=0;c<g.cols;c++) out.push({name:pre+(g.dir==="down"?String.fromCharCode(65+s+c)+(r+1):String.fromCharCode(65+s+r)+(c+1)), r, c});
        } else {
          const s=parseInt(g.start,10); if(!(s>=0)) err="Start at must be a number.";
          for(let r=0;r<g.rows&&!err;r++) for(let c=0;c<g.cols;c++) out.push({name:pre+(s+(g.dir==="down"?c*g.rows+r:r*g.cols+c)), r, c});
        }
        if(!err) out.sort((a,b)=>g.dir==="down"?(a.c-b.c||a.r-b.r):(a.r-b.r||a.c-b.c));
        out.forEach(x=>{ x.box={x:d.x+x.c*d.w/g.cols, y:d.y+x.r*d.h/g.rows, w:d.w/g.cols, h:d.h/g.rows}; });
        return {g, cells:out, err};
      }
      function drawDraft(){

        } else draftEl.innerHTML="";
      }
      function gridPreview(){
        const {cells,err,g}=gridCells(), out=el.querySelector("#me-gprev"), btn=el.querySelector("#me-gadd"); if(!out) return;
        if(err){ out.innerHTML=`<span class="warnt">${esc(err)}</span>`; btn.disabled=true; btn.textContent="Create bins"; drawDraft(); return; }
        const taken=new Set(Object.values(S.locations).filter(l=>l.unitId===unitId && (l.section||"")===g.sec).map(l=>String(l.name).trim().toLowerCase()));

        out.innerHTML=`${cells.length} bin${cells.length===1?"":"s"}: ${esc(names)}${dup.length?`<br><span class="warnt">Already used here: ${esc(dup.slice(0,4).join(", "))}${dup.length>4?"…":""}. Change “Start at” to avoid duplicates.</span>`:""}`;
        btn.disabled=false; btn.textContent=`Create ${cells.length} bin${cells.length===1?"":"s"}`;
        drawDraft();
      }
      function drawPanel(){
        if(st.mode==="select"){
          [...st.picked].forEach(id=>{ if(!S.locations[id]) st.picked.delete(id); });

          panel.innerHTML=`<div class="g2"><label class="field"><span>Location</span><select id="me-which"><option value="">New location</option>${unplaced.map(l=>`<option value="${l.id}" ${st.assign===l.id?"selected":""}>${esc(invLocLabel(l.id)||l.name)} (not on map)</option>`).join("")}</select></label>

            <div class="field"><span>Section</span>${seg("me-sec",SECTIONS,a&&a.section?a.section:guessSec(st.draft))}</div>
            <div class="acts two"><button class="btn primary" data-s="draw-add">Add box</button><button class="btn" data-s="draft-clear">Redraw</button></div>`;
          el.querySelector("#me-which").addEventListener("change",e=>{ el.querySelector("#me-newname").hidden=!!e.target.value; });

        const p=pt(e);

          const bx=e.target.closest(".ibox");

        } else {

        if(Math.abs(dx)+Math.abs(dy)>0.003) d.moved=true;
        const o=d.orig; let b;
        if(d.kind==="move") b={x:clamp(o.x+dx,0,1-o.w), y:clamp(o.y+dy,0,1-o.h), w:o.w, h:o.h};
        else if(d.kind==="se") b={x:o.x, y:o.y, w:clamp(o.w+dx,0.01,1-o.x), h:clamp(o.h+dy,0.01,1-o.y)};
        else { const nx=clamp(o.x+dx,0,o.x+o.w-0.01), ny=clamp(o.y+dy,0,o.y+o.h-0.01); b={x:nx, y:ny, w:o.x+o.w-nx, h:o.y+o.h-ny}; }
        d.box=b; const be=boxesEl.querySelector(`[data-loc="${d.id}"]`); if(be) be.setAttribute("style",boxStyle(b));
      });
      const endDrag=e=>{
        const d=st.drag; if(!d) return; st.drag=null;
        if(d.kind==="sel"){
          if(e.type!=="pointercancel"){
            if(d.moved && st.draft){ const r=st.draft;
              unitLocs().forEach(l=>{ const b=l.box; if(b.x<r.x+r.w && b.x+b.w>r.x && b.y<r.y+r.h && b.y+b.h>r.y) st.picked.add(l.id); }); }
            else if(d.target){ st.picked.has(d.target)?st.picked.delete(d.target):st.picked.add(d.target); }
          }
          st.draft=null; drawDraft(); drawBoxes(); drawPanel(); return;
        }
        if(d.kind==="draw"){
          const r=st.draft;
          if(!r || r.w<0.015 || r.h<0.015 || e.type==="pointercancel"){ st.draft=null; st.drawn=false; drawDraft(); drawPanel(); return; }
          st.drawn=true; drawDraft(); drawPanel(); return;
        }
        if(d.moved && d.box) write("locations",d.id,"update",{box:roundBox(d.box), updatedAt:now()});
      };
      stage.addEventListener("pointerup",endDrag);
      stage.addEventListener("pointercancel",endDrag);

      el.addEventListener("click", async e=>{
        if(st.mode==="grid" && st.drawn && e.target.closest('.seg[data-name="me-dir"] button')){ ui.invGridDir=segVal(el,"me-dir"); PREF.set("invGridDir",ui.invGridDir); gridPreview(); return; }
        if(st.mode==="grid" && st.drawn && e.target.closest('.seg[data-name="me-sec"] button, .seg[data-name="me-style"] button')){
          el.querySelector("#me-start").value=autoStart(segVal(el,"me-sec"),segVal(el,"me-style"),val(el,"me-prefix")); gridPreview(); return;
        }
        const secb=st.mode==="select" && e.target.closest('.seg[data-name="bk-sec"] button');
        if(secb){ const ids=[...st.picked], sec=secb.dataset.v; if(ids.length && await writeMany(ids.map(id=>["locations",id,"update",{section:sec,updatedAt:now()}]))){ toast(`Moved ${ids.length} to ${secName(sec)||"no section"}`); drawPanel(); } return; }
        const b=e.target.closest("[data-s]"); if(!b || b.disabled) return;
        const s=b.dataset.s;
        if(s==="mode"){ st.mode=b.dataset.v; st.draft=null; st.drawn=false; st.drag=null; if(st.mode!=="move") st.sel=null; if(st.mode!=="draw") st.assign=null; if(st.mode!=="select") st.picked.clear(); drawAll(); }
        else if(s==="pick-all"){ unitLocs().forEach(l=>st.picked.add(l.id)); drawBoxes(); drawPanel(); }
        else if(s==="pick-none"){ st.picked.clear(); drawBoxes(); drawPanel(); }
        else if(s==="bulk-rename"){ bulkRenameSheet([...st.picked], backHere); }
        else if(s==="bulk-del"){ const ids=[...st.picked]; const ok=await bulkDeleteLocations(ids); if(ok) st.picked.clear(); backHere(); }
        else if(s==="bulk-off"){ const ids=[...st.picked]; if(await writeMany(ids.map(id=>["locations",id,"update",{box:null,updatedAt:now()}]))){ st.picked.clear(); drawAll(); toast(`Took ${ids.length} off the map. The locations and their parts are kept.`); } }
        else if(s==="unit-switch"){ if(b.dataset.id!==unitId) mapEditor(b.dataset.id,{mode:st.mode==="move"?"move":st.mode}); }
        else if(s==="unit-edit"){ unitSheet(unitId,{back:true}); }
        else if(s==="draft-clear"){ st.draft=null; st.drawn=false; drawDraft(); drawPanel(); }
        else if(s==="sel-save"){ const l=S.locations[st.sel]; if(!l) return; const name=val(el,"me-name"); if(!name){ toast("Enter a name.","bad"); return; }
          if(write("locations",l.id,"update",{name, desc:val(el,"me-desc"), section:segVal(el,"me-sec"), updatedAt:now()})){ drawBoxes(); toast("Saved"); } }
        else if(s==="sel-off"){ const l=S.locations[st.sel]; if(!l) return;
          if(write("locations",l.id,"update",{box:null, updatedAt:now()})){ st.sel=null; drawAll(); toast("Taken off the map. The location and its parts are kept."); } }
        else if(s==="sel-del"){ const l=S.locations[st.sel]; if(!l) return; await deleteLocation(l); mapEditor(unitId,{mode:"move"}); }
        else if(s==="draw-add"){
          if(!st.draft) return;
          const which=val(el,"me-which"), sec=segVal(el,"me-sec"), box=roundBox(st.draft);
          if(which){ if(!write("locations",which,"update",{unitId, section:sec, box, updatedAt:now()})) return; }
          else { const name=val(el,"me-name"); if(!name){ toast("Enter a name for this box.","bad"); return; }
            if(!write("locations",newId(),"set",Object.assign(stamp({createdAt:now()}),{name, details:"", unitId, section:sec, box}))) return; }
          st.draft=null; st.drawn=false; st.assign=null; drawAll(); toast("Box added");
        }
        else if(s==="grid-add"){
          if(!st.draft) return;
          const {cells,err,g}=gridCells(); if(err){ toast(err,"bad"); return; }
          if(cells.length>200){ toast("That's more than 200 bins. Draw a smaller block.","bad"); return; }
          b.disabled=true; b.textContent="Creating…";
          const t=now(), ok=await writeMany(cells.map(x=>["locations",newId(),"set",Object.assign(stamp({createdAt:t}),{name:x.name, details:"", unitId, section:g.sec, box:roundBox(x.box)})]));
          if(!ok) return;
          st.draft=null; st.drawn=false; drawAll(); toast(`Added ${cells.length} bin${cells.length===1?"":"s"}`);
        }
      });
    }});
}

/* =========================================================
   Batteries (Overall app area)
   batteries/{id}: {label, purchased:"YYYY-MM", brand, notes, retired, createdAt, uid, who}
   battlog/{id}:   {batteryId, kind:"charged"|"pre"|"post"|"check", matchId, v, pct, ir (ohms), via:"typed"|"photo", at, uid, who}
   settings.batt:  {irGood, irRetire, vMin, pctMin, label:{size, header, headerText, numSize, ink, qr, brand, date, footer, border, custom:{w,h,cols,rows,top,left,gx,gy} in inches}}
   matches:        batteryId (+ battery = label text, kept for older records)
   ========================================================= */
/* Battery QR labels open ARTIFACT_URL#b-<batteryId>. Labels printed before the move point at the old artifact. */
const ARTIFACT_URL = BOARD_URL || (location.origin+location.pathname);
const BKIND = {charged:"Off charger",pre:"Pre-match",post:"Post-match",check:"Spot check"};
const BGRADE = {good:"Good",watch:"Watch",retire:"Retire",retired:"Retired",none:"No reading"};
const BGRADE_CLS = {good:"ok",watch:"warn",retire:"bad",retired:"",none:""};
const BREADY = {ready:"Ready",charge:"Needs charge",assigned:"Set for match",none:"No reading",out:"Retired",no:"Don't use"};
const BREADY_CLS = {ready:"ok",charge:"warn",assigned:"brand",none:"",out:"",no:"bad"};
const BATT_DEF = {irGood:0.015, irRetire:0.020, vMin:12.7, pctMin:90};
function battCfg(){ const c=Object.assign({}, BATT_DEF, settings().batt||{}); for(const k in BATT_DEF){ c[k]=Number(c[k]); if(!isFinite(c[k])) c[k]=BATT_DEF[k]; } return c; }
const batsSorted = () => Object.values(S.batteries).sort((a,b)=>(a.retired?1:0)-(b.retired?1:0)||String(a.label).localeCompare(String(b.label),undefined,{numeric:true}));
const batLogs = id => Object.values(S.battlog).filter(r=>r.batteryId===id).sort((a,b)=>(a.at||0)-(b.at||0));
const numOr = v => (v===null||v===undefined||v===""||!isFinite(Number(v))) ? null : Number(v);
const fmtIr = ir => numOr(ir)==null ? "–" : Number(ir).toFixed(3);
const fmtV = v => numOr(v)==null ? "–" : Number(v).toFixed(2);
const fmtPct = p => numOr(p)==null ? "–" : Math.round(Number(p));
function parseIr(s){ const n=Number(String(s||"").trim().replace(",",".")); if(!isFinite(n)||n<=0) return null; return n>=1 ? n/1000 : n; }
function parseNum(s){ const t=String(s||"").trim().replace(",","."); if(!t) return null; const n=Number(t); return isFinite(n)?n:null; }
function ageText(p){ if(!p) return ""; const [y,m]=String(p).split("-").map(Number); if(!y) return ""; const d=new Date(), mo=(d.getFullYear()-y)*12+(d.getMonth()+1-(m||1)); if(mo<1) return "new this month"; return mo<12? mo+" mo old" : Math.floor(mo/12)+"y "+(mo%12)+"m old"; }
function batIdFor(label){ const l=String(label||"").trim().toLowerCase(); if(!l) return null; const b=Object.values(S.batteries).find(x=>String(x.label).trim().toLowerCase()===l); return b?b.id:null; }
function batOfMatch(m){ if(!m) return null; return (m.batteryId && S.batteries[m.batteryId]) || (m.battery && S.batteries[batIdFor(m.battery)]) || null; }
function batInfo(b){
  const cfg=battCfg(), logs=batLogs(b.id), t=now();
  const last=logs[logs.length-1]||null, lastIr=[...logs].reverse().find(r=>numOr(r.ir)!=null)||null;
  const ms=Object.values(S.matches).filter(m=>(batOfMatch(m)||{}).id===b.id);
  const played=ms.filter(m=>m.result || (m.time && effTime(m)<=t));
  const upcoming=ms.filter(m=>!m.result && m.time && effTime(m)>t).sort((a,c)=>effTime(a)-effTime(c))[0]||null;
  const posts=logs.filter(r=>r.kind==="post");
  const lastUse=Math.max(0,...posts.map(r=>r.at||0),...played.map(m=>Math.min(effTime(m)+3*60000,t)));
  const matchIds=new Set([...played.map(m=>m.id),...posts.filter(r=>r.matchId).map(r=>r.matchId)]);
  const uses=matchIds.size+posts.filter(r=>!r.matchId).length;
  const cycles=logs.filter(r=>r.kind==="charged").length;
  const drops=[];
  matchIds.forEach(mid=>{ const pre=logs.filter(r=>r.matchId===mid&&r.kind==="pre").pop(), post=logs.filter(r=>r.matchId===mid&&r.kind==="post").pop();
    if(pre&&post&&numOr(pre.v)!=null&&numOr(post.v)!=null){ const m=S.matches[mid]; drops.push({mid,label:m?mlabel(m):"Match",drop:pre.v-post.v,pre:pre.v,post:post.v,at:post.at}); } });
  drops.sort((a,c)=>a.at-c.at);
  const avgDrop=drops.length?drops.reduce((a,c)=>a+c.drop,0)/drops.length:null;
  const grade = b.retired?"retired" : !lastIr?"none" : lastIr.ir>cfg.irRetire?"retire" : lastIr.ir>cfg.irGood?"watch" : "good";
  let ready, why;
  if(b.retired){ ready="out"; why="Retired from use"; }
  else if(upcoming){ ready="assigned"; why="Set for "+mlabel(upcoming); }
  else if(!last){ ready="none"; why="Log a check to see if it's ready"; }
  else if(grade==="retire"){ ready="no"; why=`Resistance ${fmtIr(lastIr.ir)} Ω is above ${fmtIr(cfg.irRetire)} Ω`; }
  else if(last.kind==="post" || (last.at||0)<lastUse){ ready="charge"; why="Used since its last check. Charge it, then log an off-charger check"; }
  else if((numOr(last.v)!=null && last.v<cfg.vMin) || (numOr(last.pct)!=null && last.pct<cfg.pctMin)){ ready="charge"; why=`Below ${cfg.vMin} V or ${cfg.pctMin}% at last check`; }
  else { ready="ready"; why="Charged and checked"; }
  return {b,logs,last,lastIr,grade,ready,why,uses,cycles,avgDrop,drops,upcoming,lastUse};
}
function suggestBatteries(){
  const gr={good:0,watch:1,none:2};
  return batsSorted().map(batInfo).filter(x=>x.ready==="ready")
    .sort((a,c)=>(gr[a.grade]??3)-(gr[c.grade]??3) || (a.lastIr?a.lastIr.ir:9)-(c.lastIr?c.lastIr.ir:9) || a.lastUse-c.lastUse);
}
const gradePill = g => `<span class="pill ${BGRADE_CLS[g]||""}">${g==="retire"?ICON.alert:g==="good"?ICON.check:""}${BGRADE[g]||g}</span>`;
const readyPill = x => `<span class="pill ${BREADY_CLS[x.ready]||""}">${x.ready==="assigned"&&x.upcoming?"Set for "+esc(mlabel(x.upcoming)):BREADY[x.ready]}</span>`;
function readLine(r){ if(!r) return "No readings yet"; return `${fmtV(r.v)} V · ${fmtPct(r.pct)}% · ${fmtIr(r.ir)} Ω`; }
function assignBattery(matchId,batId){
  const m=S.matches[matchId], b=S.batteries[batId]; if(!m||!b) return;
  if(write("matches",matchId,"update",{batteryId:b.id,battery:b.label})) toast(`${b.label} set for ${mlabel(m)}`);
}

/* ---- charts ---- */
function irSeries(logs){ return logs.filter(r=>numOr(r.ir)!=null); }
function irSpark(logs){
  const pts=irSeries(logs).slice(-12), cfg=battCfg();
  if(pts.length<2) return `<span class="bspark-none">${pts.length?"1 resistance reading so far":"No resistance readings yet"}</span>`;
  const W=160,H=40,P=4, vals=pts.map(r=>r.ir);
  const lo=Math.min(...vals,cfg.irGood)*0.92, hi=Math.max(...vals,cfg.irRetire)*1.06;
  const X=i=>P+i*(W-2*P)/(pts.length-1), Y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const last=pts[pts.length-1];
  return `<svg class="bspark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Internal resistance trend, latest ${fmtIr(last.ir)} ohms">
    <line x1="${P}" x2="${W-P}" y1="${Y(cfg.irRetire)}" y2="${Y(cfg.irRetire)}" class="ref bad"/><line x1="${P}" x2="${W-P}" y1="${Y(cfg.irGood)}" y2="${Y(cfg.irGood)}" class="ref warn"/>
    <polyline points="${pts.map((r,i)=>X(i)+","+Y(r.ir)).join(" ")}" class="ln"/><circle cx="${X(pts.length-1)}" cy="${Y(last.ir)}" r="3.5" class="dot"/></svg>`;
}
function irChart(logs){
  const pts=irSeries(logs).slice(-30), cfg=battCfg();
  if(!pts.length) return `<p class="muted">No internal resistance readings yet. Log a check with the Battery Beak to start the trend.</p>`;
  const W=640,H=220,L=58,R=16,T=14,B=30, vals=pts.map(r=>r.ir);
  const lo=Math.min(...vals,cfg.irGood)*0.9, hi=Math.max(...vals,cfg.irRetire)*1.08;
  const n=pts.length, X=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks=[lo, cfg.irGood, cfg.irRetire, hi].filter((v,i,a)=>a.findIndex(w=>Math.abs(Y(w)-Y(v))<14)===i);
  const lab=r=>{ const m=r.matchId&&S.matches[r.matchId]; return `${BKIND[r.kind]||"Check"}${m?" "+mlabel(m):""} · ${fmtIr(r.ir)} Ω · ${fmtDay(r.at)} ${fmtClock(r.at)}`; };
  return `<div class="bchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Internal resistance over the last ${n} readings">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" class="tk">${v.toFixed(3)}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${Y(cfg.irRetire)}" y2="${Y(cfg.irRetire)}" class="ref bad"/><text x="${W-R}" y="${Y(cfg.irRetire)-5}" text-anchor="end" class="tk">Retire above</text>
    <line x1="${L}" x2="${W-R}" y1="${Y(cfg.irGood)}" y2="${Y(cfg.irGood)}" class="ref warn"/><text x="${W-R}" y="${Y(cfg.irGood)-5}" text-anchor="end" class="tk">Watch above</text>
    ${n>1?`<polyline points="${pts.map((r,i)=>X(i)+","+Y(r.ir)).join(" ")}" class="ln"/>`:""}
    ${pts.map((r,i)=>`<g class="pt"><circle cx="${X(i)}" cy="${Y(r.ir)}" r="12" class="hit"><title>${esc(lab(r))}</title></circle><circle cx="${X(i)}" cy="${Y(r.ir)}" r="4.5" class="dot"/></g>`).join("")}
    <text x="${L}" y="${H-8}" class="tk">${esc(fmtDay(pts[0].at))}</text>${n>1?`<text x="${W-R}" y="${H-8}" text-anchor="end" class="tk">${esc(fmtDay(pts[n-1].at))}</text>`:""}
  </svg></div>`;
}

/* ---- view ---- */
VIEWS.batteries = {
shell:()=>`<div class="pagehead"><h1>Batteries</h1><div class="row"><button class="btn" data-act="bat-cfg">Grade cutoffs</button><button class="btn" data-act="bat-labels">${ICON.print}Print labels</button><button class="btn" data-act="bat-new">${ICON.plus}Add battery</button><button class="btn primary" data-act="bat-log">${ICON.batteries}Log check</button></div></div><div id="v-body"></div>`,

      <div class="row">${m?`<button class="btn primary" data-act="bat-assign" data-id="${x.b.id}" data-match="${m.id}">Use ${esc(x.b.label)} for ${esc(mlabel(m))}</button>`:`<span class="muted">Add the match schedule to set a battery for each match.</span>`}
      ${m&&sug.length>1?`<span class="muted">Or:</span>${sug.slice(1,4).map(y=>`<button class="btn sm" data-act="bat-assign" data-id="${y.b.id}" data-match="${m.id}">${esc(y.b.label)} · ${BGRADE[y.grade]}</button>`).join("")}`:""}</div>`;

      <div class="row"><button class="btn primary" data-act="bat-log" data-kind="charged">${ICON.batteries}Log off-charger check</button>${m?`<button class="btn" data-act="bat-pick" data-match="${m.id}">Pick one anyway</button>`:""}</div>`;
  }
  h+=`</section>`;
  const act=infos.filter(x=>!x.b.retired), cnt=k=>act.filter(x=>x.ready===k).length;
  h+=`<div class="stats" style="margin:16px 0">
    <div class="stat ok"><div class="v">${cnt("ready")}</div><div class="k">Ready</div></div>
    <div class="stat ${cnt("charge")?"warn":""}"><div class="v">${cnt("charge")}</div><div class="k">Need charging</div></div>
    <div class="stat"><div class="v">${act.filter(x=>x.grade==="watch").length}</div><div class="k">Graded Watch</div></div>
    <div class="stat ${act.filter(x=>x.grade==="retire").length?"bad":""}"><div class="v">${act.filter(x=>x.grade==="retire").length}</div><div class="k">Should retire</div></div></div>`;
  h+=`<div class="bgrid">${infos.map(x=>`<div class="bcard g-${x.grade}">
      <button class="bmain" data-act="bat-open" data-id="${x.b.id}" aria-label="Open battery ${esc(x.b.label)}">
        <span class="btop"><span class="blabel sm">${esc(x.b.label)}</span><span class="row" style="gap:6px">${gradePill(x.grade)}${readyPill(x)}</span></span>
        <span class="bread"><span><b>${fmtV(x.last&&x.last.v)}</b> V</span><span><b>${fmtPct(x.last&&x.last.pct)}</b> %</span><span><b>${fmtIr(x.lastIr&&x.lastIr.ir)}</b> Ω</span></span>

async function readBeakPhoto(file,el,sync){

  try{
    const img=await shrink(file);
    const labels=batsSorted().map(b=>b.label).join(", ");
    const out=await sampleCap.json(`This photo shows the screen of a CTRE Battery Beak battery tester connected to a 12 V FRC robot battery. Read the numbers on its display.

    const v=numOr(out&&out.voltage), p=numOr(out&&out.charge_pct), r=numOr(out&&out.internal_resistance_ohms);
    if(v==null&&p==null&&r==null){ st.textContent="No readings found in that photo. Retake it straight on, with the whole screen in frame."; return; }
    if(v!=null) el.querySelector("#bl-v").value=v.toFixed(2);

    el.dataset.via="photo";

    sync&&sync();

}
/* Why a battery shouldn't run match m, or "" if it's fine. Used by the pick sheet to ask before assigning. */
function batUseWarning(b,m){
  if(!b||!m||m.result) return "";
  const x=batInfo(b), cfg=battCfg(), t=now(), L=b.label, tail=` Use it for ${mlabel(m)} anyway?`;
  if(x.ready==="charge"){
    const ran=matchesSorted().filter(o=>o.id!==m.id&&(batOfMatch(o)||{}).id===b.id&&(o.result||(o.time&&effTime(o)<=t))).pop();
    const used=x.last&&(x.last.kind==="post"||(x.last.at||0)<x.lastUse);
    if(used) return (ran?`${L} ran ${mlabel(ran)} and hasn't been charged since.`:`${L} was used in a match and hasn't been charged since.`)+" Log an off-charger check once it's charged."+tail;
    return `${L} was below ${cfg.vMin} V or ${cfg.pctMin}% at its last check.`+tail;
  }
  if(x.ready==="no") return `${L} has ${fmtIr(x.lastIr&&x.lastIr.ir)} Ω internal resistance, above the ${fmtIr(cfg.irRetire)} Ω retire cutoff.`+tail;
  if(x.ready==="assigned"&&x.upcoming&&x.upcoming.id!==m.id) return `${L} is already set for ${mlabel(x.upcoming)}. It will stay set for that match too, with no time to charge in between.`+tail;
  return "";
}

function blCustClean(o){ const r={}; for(const k in BL_CUST_DEF){ const n=Number(o&&o[k]); r[k]=isFinite(n)&&n>=0?n:BL_CUST_DEF[k]; } return r; }
/* "2", "2.625", "2 5/8", "2-5/8", "5/8", or millimetres like "50 mm" -> inches (null if unreadable) */
function parseIn(v){
  let t=String(v==null?"":v).trim().toLowerCase().replace(",","."); if(!t) return null;
  let mm=false; if(/mm$/.test(t)){ mm=true; t=t.replace(/mm$/,"").trim(); } else t=t.replace(/(in|inch|inches|")$/,"").trim();

  else if((m=t.match(/^(\d+)[\s-]+(\d+)\/(\d+)$/))) n=Number(m[1])+Number(m[2])/Number(m[3]);
  else if((m=t.match(/^(\d+)\/(\d+)$/))) n=Number(m[1])/Number(m[2]);
  if(n==null||!isFinite(n)) return null;

  if(u.w<0.75||u.h<0.5) return "Labels need to be at least 0.75 in wide and 0.5 in tall.";
  if(!Number.isInteger(u.cols)||!Number.isInteger(u.rows)||u.cols<1||u.rows<1) return "Labels across and down must be whole numbers, 1 or more.";
  if(u.cols>12||u.rows>40) return "That's more labels than fit on a page. Use up to 12 across and 40 down.";
  const across=u.left+u.cols*u.w+(u.cols-1)*u.gx, down=u.top+u.rows*u.h+(u.rows-1)*u.gy;
  if(across>8.52) return `Too wide: the labels reach ${fmtIn(across)} in across, but a letter page is 8.5 in.`;

}

/* Returns positions in points, relative to the label's top-left corner. */
function batLabelLayout(c,b,sz,measure,qrOn){
  const W=sz.W, H=sz.H, pad=Math.max(6,Math.min(14,Math.min(W,H)*0.1)), gap=Math.max(2.5,H*0.04);
  const stack=W/H<1.8, left=c.qr==="left", items=[];
  const dfs=Math.max(6,Math.min(11,H*0.0625)), lh=dfs*1.4;
  const meta=[c.brand?b.brand:"", c.date&&b.purchased?"In service "+b.purchased:""].filter(Boolean).map(blClean).join("  |  ");
  const lines=[meta, blClean(c.footer).trim()].filter(Boolean);
  let tx=pad, tw=W-2*pad, qr=null;
  if(qrOn){
    if(!stack){ const s=Math.min(H-2*pad, W*0.4); qr={x:left?pad:W-pad-s, y:(H-s)/2, s}; tw=W-2*pad-s-gap*2; if(left) tx=pad+s+gap*2; }
    else { const s=Math.min(H*0.42, W*0.45); qr={x:left?pad:W-pad-s, y:H-pad-s, s}; }
  }
  let y=pad;
  const hh=c.header==="none"?0:Math.min(H*0.15, W*0.08);
  if(c.header==="logo"){ let w=hh*WORD_RATIO, h=hh; if(w>tw){ h=h*tw/w; w=tw; } items.push({k:"logo",x:tx,y,w,h}); }
  else if(c.header==="text" && blClean(c.headerText).trim()){
    const t=blClean(c.headerText).trim(); let fs=hh*0.97; const mw=measure(t,fs,true); if(mw>tw) fs=fs*tw/mw;
    items.push({k:"text",x:tx,y:y+hh*0.85,s:fs,bold:true,blue:c.ink==="blue",t});
  }
  if(hh) y+=hh+gap;
  // detail + bottom lines, bottom-aligned
  const lx = stack&&qr ? (left?pad+qr.s+gap*2:pad) : tx, lw = stack&&qr ? W-2*pad-qr.s-gap*2 : tw;
  lines.forEach((t,i)=>{ let fs=dfs; const mw=measure(t,fs,false); if(mw>lw) fs=Math.max(4.5,fs*lw/mw);
    if(measure(t,fs,false)>lw){ while(t.length>1 && measure(t+"...",fs,false)>lw) t=t.slice(0,-1).trimEnd(); t+="..."; }

function batQr(b){ if(!window.qrcode) return null; const q=window.qrcode(0,"M"); q.addData(ARTIFACT_URL+"#b-"+b.id); q.make(); return q; }

function batLabelSvg(c,b){
  const sz=blSize(c), qrOn=c.qr!=="off", L=batLabelLayout(c,b,sz,blMeasureScreen,qrOn);
  let h=`<svg class="blprev" viewBox="0 0 ${L.W} ${L.H}" style="max-width:${Math.round(Math.min(640,Math.max(160,L.W*1.45)))}px" role="img" aria-label="Preview of the label for battery ${esc(b.label)}"><rect class="paper" x=".5" y=".5" width="${L.W-1}" height="${L.H-1}" rx="5"/>`;
  if(c.border) h+=`<rect class="cut" x="3" y="3" width="${L.W-6}" height="${L.H-6}"/>`;
  L.items.forEach(it=>{
    if(it.k==="logo"){ const id="blm"+(++blMaskN); h+=`<mask id="${id}" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}"><image href="${WORD_PNG}" x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" preserveAspectRatio="none"/></mask><rect class="logo" x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" mask="url(#${id})"/>`; }

function drawBatLabel(doc,c,b,sz,ox,oy,qrOn){

function buildBatLabels(bats,withQr,o){

  if(!withQr && c.qr!=="off" && c.footer===BL_DEF.footer) c.footer="Team 1323 battery";
  const copies=Math.max(1,Math.min(10,o.copies||1)), start=Math.max(0,Math.min(per-1,o.start||0));

function homeInvHits(q){
  const words=String(q||"").trim().toLowerCase().split(/\s+/).filter(Boolean); if(!words.length) return null;
  return Object.values(S.inventory).filter(p=>{ const hay=[p.name,p.category,invLocLabel(p.locationId),p.notes].join(" ").toLowerCase(); return words.every(w=>hay.includes(w)); }).sort(byName);
}
function paintHomeRes(){
  const el=$("#home-res"); if(!el) return;
  const q=(ui.homeQ||"").trim(), hits=homeInvHits(q);
  if(!hits){ el.innerHTML=""; return; }
  const shown=hits.slice(0,6);
  el.innerHTML=`<div class="card hres" role="status"><div class="hres-h"><b>${hits.length?`${hits.length} part${hits.length===1?"":"s"}`:"No parts"} match “${esc(q)}”</b><span class="spacer"></span>${hits.length?`<button class="btn sm" data-act="home-inv-all">See all in Inventory</button>`:""}<button class="btn sm ghost" data-act="home-q-clear">Clear</button></div>
    ${shown.length?`<ul class="hres-list">${shown.map(p=>{ const l=S.locations[p.locationId], lab=l?invLocLabel(l.id):"";
      return `<li class="hres-row"><button class="hres-main" data-act="home-part" data-id="${p.id}" aria-label="Open ${esc(p.name)}"><b>${esc(p.name)}${isLow(p)?` <span class="pill warn">Low</span>`:""}</b><span class="w ${lab?"":"none"}">${lab?esc(lab):"No location set"}</span><span class="q">${Number(p.qty)||0}<small>on hand</small></span></button>${onMap(l)?`<button class="btn" data-act="home-map" data-id="${l.id}" aria-label="Show ${esc(p.name)} on the storage map">Map</button>`:""}</li>`; }).join("")}</ul>`
      :`<p class="muted">Try another word, or check the spelling.</p>`}
    ${hits.length>shown.length?`<button class="btn sm ghost" data-act="home-inv-all">+${hits.length-shown.length} more in Inventory</button>`:""}</div>`;
}
function paintHomeScan(){
  const b=$("#home-scan"); if(!b) return; const run=activeRun();
  b.innerHTML=`${ICON.camera}${run?"Scan "+esc(run.label)+" checklist":"Scan checklist"}`;
}
function homeToInventory(tab,locId){
  ui.invQ=ui.homeQ||""; ui.invTab=tab; ui.invTabInit=true; PREF.set("invTab",tab);
  go("inventory").then(()=>{ if(locId && typeof invFocus==="function") invFocus(locId); });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("click", async e=>{
  if(e.target.closest(".sheet")) return;
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case "settings": settingsSheet(); break;
    case "ck-tab": {
      if(ui.ed && ui.ed.dirty && !(await confirmBox("You have unsaved checklist changes. Leave without saving them?","Discard changes"))) break;
      ui.ed=null; ui.ckTab=b.dataset.v; PREF.set("ckTab",ui.ckTab); if(ui.view!=="checklist") go("checklist",true); else render(); break; }
    case "go-build": ui.ckTab="build"; PREF.set("ckTab","build"); go("checklist"); break;
    case "new-run": newRunSheet(); break;
    case "del-runs": delRunsSheet(); break;
    case "peek": peekScan(id); break;
    case "reset-run": resetRun(null); break;
    case "reset-sec": resetRun(id); break;
    case "undo-reset": undoReset(); break;
    case "edit-assign": openEditor(id); setTimeout(()=>{ const f=document.querySelector('input[data-ed="sassign"]'); if(f){ f.scrollIntoView({block:"center"}); if(window.matchMedia("(min-width:760px)").matches) f.focus(); } },60); break;
    case "start-run": createRun(mlabel(S.matches[b.dataset.match]), b.dataset.match); break;
    case "open-run": setActiveRun(id); ui.ckTab="status"; PREF.set("ckTab","status"); go("checklist"); break;
    case "print-run": printRun(activeRun()); break;
    case "scan": quickScan(); break;
    case "tick": { const run=activeRun(); if(!run) break; const on=run.checks&&run.checks[id]; setCheck(id,!on,"app"); break; }
    case "verify": setCheck(id,true,"verified"); toast("Marked done"); break;
    case "unverify": setCheck(id,false); break;
    case "flag": { const run=activeRun(), rs=run&&runState(run), r=rs&&rs.N.byId[id]; if(!r) break;
      const rid=run.flags&&run.flags[id]; if(rid && S.repairs[rid]){ repairSheet(rid); break; }
      repairSheet(null,{title:r.it.text.replace(/\s+/g," "), subsystem:r.sec.name, found:run.label, runId:run.id, itemId:id}); break; }
    /* builder */
    case "new-cl": newChecklistSheet(); break;
    case "edit-cl": openEditor(id); break;
    case "print-cl": printChecklist(S.checklists[id],""); break;
    case "dup-cl": dupChecklist(id); break;
    case "def-cl": saveSettings({defaultChecklistId:id}); toast("New match checklists will use this one"); break;
    case "del-cl": { const c=S.checklists[id]; if(!c) break; const used=Object.values(S.runs).filter(r=>r.checklistId===id).length;
      if(await confirmBox(`Delete “${c.year} ${c.name}”?${used?` ${used} match checklist${used===1?"":"s"} use it and will lose their item list.`:""}`,"Delete checklist")){ write("checklists",id,"delete"); toast("Checklist deleted"); } break; }
    case "ed-save": edSave(); break;
    case "ed-close": { if(ui.ed&&ui.ed.dirty&&!(await confirmBox("Leave without saving your changes?","Discard changes"))) break; ui.ed=null; render(); window.scrollTo(0,0); break; }
    case "ed-print": { if(!ui.ed) break; if(ui.ed.dirty){ toast("Save your changes first so the printed sheet matches.","bad"); break; } printChecklist(S.checklists[ui.ed.id],""); break; }
    case "ed-sadd": { ui.ed.draft.sections.push({id:newId(),name:"New section",items:[]}); edMark(); const sid=ui.ed.draft.sections[ui.ed.draft.sections.length-1].id; paintEditor("#sn-"+sid); const f=$("#sn-"+sid); if(f) f.select(); break; }
    case "ed-sdel": { const {si}=edLoc(b), sec=ui.ed.draft.sections[si]; if((sec.items||[]).length && !(await confirmBox(`Delete the section “${sec.name}” and its ${sec.items.length} items?`,"Delete section"))) break; ui.ed.draft.sections.splice(si,1); edMark(); paintEditor(); break; }
    case "ed-smove": { const {si}=edLoc(b), d=Number(b.dataset.d), A=ui.ed.draft.sections, j=si+d; if(j<0||j>=A.length) break; [A[si],A[j]]=[A[j],A[si]]; edMark(); paintEditor(); break; }
    case "ed-imove": { const {si,ii}=edLoc(b), d=Number(b.dataset.d), A=ui.ed.draft.sections[si].items, j=ii+d;
      if(j<0||j>=A.length){ const tsi=si+d, T=ui.ed.draft.sections[tsi]; if(!T) break; const [it]=A.splice(ii,1); if(d<0) T.items.push(it); else T.items.unshift(it); }
      else [A[ii],A[j]]=[A[j],A[ii]];
      edMark(); paintEditor(); break; }
    case "ed-idel": { const {si,ii}=edLoc(b); ui.ed.draft.sections[si].items.splice(ii,1); edMark(); paintEditor(); break; }
    case "ed-star": { const {si,ii}=edLoc(b), it=ui.ed.draft.sections[si].items[ii]; it.priority=!it.priority; edMark(); b.setAttribute("aria-pressed",String(it.priority)); b.innerHTML=it.priority?ICON.starf:ICON.star; break; }
    case "ed-add": { const {si}=edLoc(b), ta=b.parentElement.querySelector("textarea"); const sid=ui.ed.draft.sections[si].id; if(edAdd(si,ta.value)||ta.value.trim()){ paintEditor("#add-"+sid); } else ta.focus(); break; }
    /* matches etc */
    case "new-match": matchSheet(); break;
    case "edit-match": matchSheet(id); break;
    case "paste-sched": pasteSheet(); break;
    case "delay": { const d=Number(b.dataset.d); saveSettings({delay: d===0?0:(Number(settings().delay)||0)+d}); break; }
    case "new-repair": repairSheet(); break;
    case "edit-repair": repairSheet(id); break;
    case "rep-status": setRepairStatus(id,b.dataset.v); break;
    case "rep-filter": ui.repFilter=b.dataset.v; render(); break;
    case "copy-repairs": { const t=repairSummaryText();
      try{ await navigator.clipboard.writeText(t); toast("Repair summary copied"); }
      catch(err){ openSheet({title:"Repair summary", body:`<p class="muted">Select all and copy.</p><textarea id="rs-text" style="min-height:280px" readonly>${esc(t)}</textarea>`, onMount(el){ const ta=el.querySelector("#rs-text"); ta.focus(); ta.select(); }}); }
      break; }
    case "new-part": partSheet(); break;
    case "edit-part": partSheet(id); break;
    case "qty": { const p=S.inventory[id]; if(p) write("inventory",id,"update",{qty:Math.max(0,(Number(p.qty)||0)+Number(b.dataset.d)), updatedAt:now()}); break; }
    case "new-loc": locSheet(); break;
    case "edit-loc": locSheet(id); break;
    case "inv-tab": ui.invTab=b.dataset.v; render(); break;
    case "inv-low": ui.invLow=!ui.invLow; ui.invTab="parts"; render(); break;
    case "inv-at": ui.invLoc=id; ui.invTab="parts"; render(); break;
    case "note-tag": ui.composeTag=b.dataset.v; render(); break;
    case "note-save": { const ta=$("#note-text"), text=ta.value.trim(); if(!text){ ta.focus(); break; }
      if(write("notes",newId(),"set",Object.assign(stamp(),{text, tag:ui.composeTag||"General", pinned:false, createdAt:now()}))){ ta.value=""; toast("Note saved"); } break; }
    case "note-pin": { const n=S.notes[id]; if(n) write("notes",id,"update",{pinned:!n.pinned}); break; }
    case "note-edit": noteSheet(id); break;
    case "home-part": partSheet(id); break;
    case "home-map": homeToInventory("map",id); break;
    case "home-inv-all": homeToInventory("parts"); break;
    case "home-q-clear": { ui.homeQ=""; const q=$("#home-q"); if(q){ q.value=""; q.focus(); } paintHomeRes(); break; }
    case "bat-new": batEditSheet(); break;
    case "bat-open": batDetail(id); break;
    case "bat-log": batLogSheet(id||null, b.dataset.kind||null, b.dataset.match||null); break;
    case "bat-assign": if(b.dataset.match) assignBattery(b.dataset.match,id); break;
    case "bat-pick": batPickSheet(b.dataset.match); break;
    case "bat-cfg": batCfgSheet(); break;
    case "bat-labels": batLabelsSheet(); break;
  }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.closest(".sheet")) return;
  if(ui.ed && t.dataset.ed){
    const {si,ii}=edLoc(t);
    if(t.dataset.ed==="type"){ ui.ed.draft.sections[si].items[ii].type=t.value; edMark(); paintEditor(); return; }
    if(t.dataset.ed==="mode"){ ui.ed.draft.sections[si].items[ii].mode=t.value; edMark(); paintEditor(); return; }
  }
  if(t.id==="ck-run"){ setActiveRun(t.value); }
  else if(t.id==="rep-sub"){ ui.repSub=t.value; render(); }
  else if(t.id==="inv-loc"){ ui.invLoc=t.value; render(); }
  else if(t.id==="inv-cat"){ ui.invCat=t.value; render(); }
  else if(t.id==="note-filter"){ ui.noteTag=t.value; render(); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.closest(".sheet")) return;
  if(ui.ed && t.dataset.ed){
    const k=t.dataset.ed, d=ui.ed.draft, {si,ii}=edLoc(t);
    if(k==="year") d.year=t.value; else if(k==="name") d.name=t.value; else if(k==="game") d.game=t.value;
    else if(k==="sname") d.sections[si].name=t.value;
    else if(k==="sassign") d.sections[si].assignee=t.value;
    else if(k==="text") d.sections[si].items[ii].text=t.value;
    else if(k==="add") return;
    edMark(); return;
  }
  if(t.id==="home-q"){ ui.homeQ=t.value; paintHomeRes(); return; }
  if(t.id==="inv-q"){ ui.invQ=t.value; VIEWS.inventory.paint(); }
  else if(t.id==="note-q"){ ui.noteQ=t.value; VIEWS.notes.paint(); }
});
document.addEventListener("keydown", e=>{
  const t=e.target;
  if(ui.ed && t.dataset && t.dataset.ed==="add" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const {si}=edLoc(t); const sid=ui.ed.draft.sections[si].id; if(t.value.trim()){ edAdd(si,t.value); paintEditor("#add-"+sid); } }
  if(ui.ed && t.dataset && t.dataset.ed==="text" && e.key==="Enter"){ e.preventDefault(); const {si}=edLoc(t); const sid=ui.ed.draft.sections[si].id; const f=$("#add-"+sid); if(f) f.focus(); }
});
document.addEventListener("toggle", e=>{ const d=e.target; if(d && d.dataset && d.dataset.sid){ if(d.open) ui.openSecs.add(d.dataset.sid); else ui.openSecs.delete(d.dataset.sid); } }, true);
window.addEventListener("beforeunload", e=>{ if(ui.ed && ui.ed.dirty){ e.preventDefault(); e.returnValue=""; } });

/* =========================================================
   Boot
   ========================================================= */
(async function boot(){
  const h=(location.hash||"").slice(1);
  if(/(^|&)error_description=/.test(h)){ const d=new URLSearchParams(h).get("error_description"); setTimeout(()=>toast("Sign-in link didn't work: "+(d||"try again")+". Send a new one from Settings.","bad"),300); history.replaceState(null,"",location.pathname+location.search); }
  if(/^b-[a-z0-9]+$/i.test(h)){ ui.pendingBat=h.slice(2); go("batteries",true); } else go(VIEWS[h]?h:PREF.get("view","home"),true);
  setInterval(tick,1000);
  Store.start();
  if(sb) sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") location.reload(); });
  Store.ready.then(()=>{
    if(Store.mode!=="live") return;
    const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    userCap = { async profiles(ids){ const o={}, q=ids.filter(i=>UUID.test(i)); if(!q.length) return o;
      const {data,error}=await sb.from("pit_members").select("user_id,name").in("user_id",q); if(error) throw error;
      (data||[]).forEach(r=>{ o[r.user_id]={name:r.name||""}; }); return o; } };
    render(); resolveNames();
  }).catch(()=>{});
  try{ await wakeLock(); }catch(e){}
})();
async function wakeLock(){ if(!("wakeLock" in navigator)) return;
  const req=async()=>{ try{ await navigator.wakeLock.request("screen"); }catch(e){} };
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") req(); }); await req(); }
})();
</script>
